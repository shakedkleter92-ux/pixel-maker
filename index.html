<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Phone-only format: on a wide (desktop/tablet) top-level window, redirect to frame.html,
         which re-embeds this same page inside a fixed phone-shaped iframe so the app always
         renders as if on a phone. Real phones (already narrow) and the embedded instance
         itself (?pmFrame=1) skip this and render normally. -->
    <script>
        (function () {
            try {
                if (window.self !== window.top) return;
                var qp = new URLSearchParams(location.search);
                if (qp.has('pmFrame')) return;
                if (window.innerWidth <= 700) return;
                location.replace('frame.html' + location.search + location.hash);
            } catch (e) { }
        })();
    </script>
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pixelart Maker" />
    <title>Pixelart Maker</title>
    <!-- Social / share preview -->
    <meta property="og:title" content="Pixelart Maker" />
    <meta property="og:description" content="make it pixel" />
    <meta property="og:image" content="https://shakedkleter92-ux.github.io/pixelmakegrid/icon.svg" />
    <meta property="og:url" content="https://shakedkleter92-ux.github.io/pixelmakegrid/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pixelart Maker" />
    <meta name="twitter:description" content="make it pixel" />
    <meta name="twitter:image" content="https://shakedkleter92-ux.github.io/pixelmakegrid/icon.svg" />
    <link rel="manifest" href="manifest.json" />
    <!-- אייקון למסך הבית — משתמש באייקון מהתיקייה -->
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #fff;
            --panel: #f3f4f6;
            --surface: #e5e7eb;
            --border: #000;
            --text: #000;
            --muted: #666;
            /* Floating controls over the canvas (camera buttons, mode header, toggle bar):
               slightly see-through so what's behind them stays visible. */
            --fab-bg: rgba(255, 255, 255, 0.82);
            /* The one deliberate spot of color in an otherwise monochrome UI: the current
               position on the zoom dial, so it reads instantly like a camera app's zoom. */
            --zoom-accent: #f5a623
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'IBM Plex Mono', monospace;
            background: var(--bg);
            color: var(--text)
        }

        #app {
            display: flex;
            height: 100vh;
            width: 100vw
        }

        /* Panel */
        #panel {
            width: 270px;
            min-width: 250px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent
        }

        /* Desktop-only section (mode switch lives in panel only on desktop) */
        .desktop-mode-switch {
            display: block;
        }

        @media (max-width: 1024px) {
            .desktop-mode-switch {
                display: none !important;
            }
        }

        #panel-header {
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--border)
        }

        #panel-header h1 {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase
        }

        #panel-header p {
            font-size: 9px;
            color: var(--muted);
            margin-top: 3px;
            letter-spacing: .05em
        }

        /* Desktop: show panel header (app title) */
        @media (min-width: 1025px) {
            #panel-header {
                display: block;
            }
        }
        /* Mobile/tablet: keep header hidden */
        @media (max-width: 1024px) {
            #panel-header {
                display: none;
            }
        }

        /* Desktop: keep panel visible in all modes */

        .section {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border)
        }

        .section:last-child {
            border-bottom: none
        }

        .sec-label {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px
        }

        /* A sec-label sharing a slider's row (e.g. Resolution) acts as that slider's
           label instead of a stacked heading — no bottom margin, no shrinking/wrapping. */
        .slider-row>.sec-label {
            margin-bottom: 0;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .sec-num {
            font-size: 8px;
            color: var(--text);
            opacity: .35
        }

        /* Sliders */
        .slider-row {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 10px;
            margin-bottom: 7px
        }

        /* Keep stacked sliders tight, but add space after button groups */
        .slider-row+.slider-row {
            margin-top: 0;
        }

        .slider-row:last-child {
            margin-bottom: 0
        }

        .sl-label {
            font-size: 9px;
            color: var(--muted);
            min-width: 58px
        }

        .sl-val {
            font-size: 9px;
            font-weight: 600;
            min-width: 32px;
            text-align: right
        }

        input[type=range] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 1px;
            background: var(--border);
            outline: none;
            cursor: pointer
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 0;
            background: var(--text);
            cursor: pointer
        }

        /* Color rows */
        .color-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 7px
        }

        .color-row:last-child {
            margin-bottom: 0
        }

        .color-row label {
            font-size: 9px;
            color: var(--muted);
            flex: 1
        }

        .palette-target {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }

        .palette-presets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }

        /* Fixed grid = every preset button is the same size no matter its label's length
           or how many presets there are; long labels are clipped with an ellipsis instead
           of stretching their button. */
        .pal-tgt {
            padding: 6px 2px;
            border: none;
            background: var(--bg);
            font-size: 8px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            text-align: center;
            cursor: pointer;
            color: var(--muted);
            transition: background .12s, color .12s, transform .12s;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (hover:hover) {
            .pal-tgt:hover {
                background: var(--surface);
                color: var(--text);
            }
        }

        .pal-tgt.active {
            background: var(--text);
            color: var(--bg);
        }

        input[type=color] {
            width: 30px;
            height: 22px;
            border: 1px solid var(--border);
            border-radius: 0;
            background: none;
            padding: 1px;
            cursor: pointer
        }

        /* Fill mode switch */
        #fill-mode {
            display: flex;
            margin-bottom: 10px
        }

        .fm-btn {
            flex: 1;
            padding: 8px 6px;
            border: none;
            border-radius: 0;
            background: var(--bg);
            font-size: 9px;
            font-weight: 600;
            letter-spacing: .09em;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'IBM Plex Mono', monospace;
            color: var(--muted);
            transition: background .12s, color .12s, transform .12s
        }

        .fm-btn:first-child {
            border-right: none
        }

        .fm-btn.active {
            background: var(--text);
            color: var(--bg)
        }

        /* Upload drop zone: overlays the canvas in #main (Image mode, no photo yet) */
        #upload-zone {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
        }

        #drop-zone {
            width: 100%;
            max-width: 220px;
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(0, 0, 0, .25);
            border-radius: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: background .15s;
        }

        #drop-zone:hover,
        #drop-zone.drag-over {
            background: var(--surface)
        }

        .dz-input {
            position: absolute;
            inset: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer
        }

        .dz-text {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6
        }

        #file-name {
            margin-top: 6px;
            font-size: 11px;
            font-weight: 600;
            word-break: break-all
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 0;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'IBM Plex Mono', monospace;
            transition: background .12s, color .12s, transform .12s;
            margin-bottom: 5px
        }

        /* Unified button interactions (like top dock): subtle scale on hover/press */
        button,
        .btn,
        .fm-btn,
        .pal-tgt,
        #panel-toggle-bar,
        #mob-shutter,
        #mob-upload-more,
        #mob-flip,
        .mob-mode-label,
        .mob-zoom-preset,
        #mob-download,
        #mob-ratio,
        #mob-gallery {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* iOS sometimes tints button text blue — force monochrome UI */
        button {
            /* Keep author-defined color, just prevent iOS blue tint */
            -webkit-text-fill-color: currentColor;
        }

        /* Active buttons must invert text color (iOS needs explicit override) */
        .pal-tgt.active,
        .fm-btn.active {
            color: var(--bg) !important;
            -webkit-text-fill-color: var(--bg) !important;
        }

        .btn:active,
        .fm-btn:active,
        .pal-tgt:active,
        #panel-toggle-bar:active,
        #mob-shutter:active,
        #mob-upload-more:active,
        #mob-flip:active,
        .mob-mode-label:active,
        .mob-zoom-preset:active,
        #mob-download:active,
        #mob-ratio:active,
        #mob-gallery:active {
            transform: scale(.97);
        }

        @media (hover:hover) {

            .btn:hover,
            .fm-btn:hover,
            .pal-tgt:hover,
            #panel-toggle-bar:hover,
            #mob-shutter:hover,
            #mob-upload-more:hover,
            #mob-flip:hover,
            .mob-mode-label:hover,
            #mob-download:hover,
            #mob-ratio:hover,
            #mob-gallery:hover {
                transform: scale(1.02);
                background: var(--surface);
            }
        }

        .btn:last-child {
            margin-bottom: 0
        }

        /* Only show inside panel on desktop; mobile uses floating undo */
        .desktop-only {
            display: block;
        }

        @media (max-width: 700px) {
            .desktop-only {
                display: none !important;
            }
        }

        /* ───── Tablet layout (drawer like mobile) ───── */
        @media (min-width: 701px) and (max-width: 1024px) {

            html,
            body {
                overflow: hidden;
                height: 100%
            }

            #app {
                flex-direction: column;
                height: 100dvh;
                overflow: hidden;
                padding-top: 0;
                box-sizing: border-box;
            }

            /* Canvas area fills the top (above bottom bar) */
            #main {
                position: fixed;
                /* Keep canvas flush under the fixed top header (no jump on panel open) */
                top: 48px;
                left: 0;
                right: 0;
                bottom: 68px;
                z-index: 0;
                height: auto;
                min-height: 0;
            }

            #grid-canvas {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }

            /* Panel becomes a sliding drawer from the bottom */
            #panel {
                position: fixed;
                bottom: 68px;
                left: 0;
                right: 0;
                width: 100%;
                min-width: unset;
                max-height: 0;
                overflow: hidden;
                border-right: none;
                border-top: 1px solid var(--border);
                z-index: 90;
                transition: max-height .35s cubic-bezier(.4, 0, .2, 1)
            }

            #panel.panel-open {
                max-height: 40vh;
                overflow-y: auto;
                /* Always sit above every floating control (mode header, shutter, zoom, etc.) */
                z-index: 200;
                background: rgba(255, 255, 255, 0.3);
                -webkit-backdrop-filter: blur(14px) saturate(140%);
                backdrop-filter: blur(14px) saturate(140%);
                isolation: isolate;
                color: var(--text);
            }

            #panel.panel-open .section {
                background: rgba(255, 255, 255, 0.18);
            }

            /* Canvas stays full-size and fixed; the panel is a translucent overlay
               that slides up over it, not a layout that pushes/shrinks it. */

            /* Show toggle bar */
            #panel-toggle-bar {
                display: flex
            }

            /* Hide desktop-only controls */
            .desktop-only {
                display: none !important;
            }
        }

        .btn-fill {
            background: var(--text);
            color: var(--bg)
        }

        .btn-fill:hover {
            background: var(--muted)
        }

        .btn-fill:disabled {
            opacity: .35;
            cursor: not-allowed
        }

        .btn-outline {
            background: var(--panel);
            color: var(--muted)
        }

        .btn-outline:hover {
            background: var(--surface);
            color: var(--text)
        }

        /* Canvas area */
        #main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            position: relative;
            overflow: hidden
        }

        #main::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: linear-gradient(45deg, #e8e8e8 25%, transparent 25%), linear-gradient(-45deg, #e8e8e8 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e8e8e8 75%), linear-gradient(-45deg, transparent 75%, #e8e8e8 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0
        }

        #grid-canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1
        }

        /* Live: canvas full viewport – 9:16 fills screen, header/bar stay on top */
        body.live-fullscreen #grid-canvas {
            position: fixed !important;
            left: 0 !important;
            top: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            z-index: 1;
        }

        /* Recording timer — top-center, only while actually recording video */
        #mob-rec-timer {
            display: none;
            position: fixed;
            top: 46px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 130;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, .55);
            border-radius: 0;
            padding: 5px 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .05em;
            color: #fff;
            -webkit-text-fill-color: #fff;
        }

        #mob-rec-timer::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff2b2b;
        }

        /* ───── Mobile top bar & panel toggle ───── */
        /* This used to sit at the bottom; it's the top bar now, and the panel opens
           downward beneath it instead of upward from the bottom. */
        #panel-toggle-bar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 36px;
            background: var(--panel);
            border-radius: 0;
            z-index: 110;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            font-family: 'IBM Plex Mono', monospace;
            color: var(--muted);
            transition: background .1s;
        }

        #panel-toggle-bar.active {
            background: var(--text);
            color: var(--bg);
        }

        #panel-toggle-bar.active span,
        #panel-toggle-bar.active button {
            color: var(--bg);
        }

        #panel-toggle-bar span {
            flex: 1;
            text-align: center;
        }

        #panel-toggle-btn {
            display: none
        }

        /* Gallery: full-screen, same light theme as the rest of the app (white background,
           black = active/selected — no separate dark theme for this screen). */
        #gallery-screen {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }

        #gallery-header {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        #gallery-close {
            background: transparent;
            border: none;
            color: var(--text);
            -webkit-text-fill-color: var(--text);
            font-size: 16px;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
        }

        #gallery-title {
            flex: 1;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .15em;
            color: var(--text);
            -webkit-text-fill-color: var(--text);
        }

        #gallery-count {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: var(--muted);
            -webkit-text-fill-color: var(--muted);
        }

        #gallery-grid {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            padding: 2px;
        }

        #gallery-empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            cursor: pointer;
            background: var(--surface);
        }

        .gallery-item img,
        .gallery-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .gallery-item .gallery-video-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            font-size: 12px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
        }

        /* Selection circle is its own tap target (stopPropagation) — tapping the rest of
           the thumbnail opens the full-screen viewer instead. */
        .gallery-item .gallery-check {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 20px;
            height: 20px;
            border-radius: 0;
            border: 1.5px solid #fff;
            background: rgba(0, 0, 0, .35);
        }

        .gallery-item.selected .gallery-check {
            background: var(--text);
            border-color: var(--text);
        }

        .gallery-item.selected::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 3px solid var(--text);
            pointer-events: none;
        }

        #gallery-actions {
            flex: 0 0 auto;
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
        }

        #gallery-actions .btn {
            width: auto;
            flex: 1;
            margin-bottom: 0;
        }

        #gallery-actions .btn:disabled {
            opacity: .35;
            cursor: default;
        }

        /* Full-screen single-item viewer: tap a thumbnail to open, swipe left/right to
           move between items, Delete/Download act on just the one being viewed. */
        #gallery-viewer {
            position: fixed;
            inset: 0;
            z-index: 310;
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }

        #gallery-viewer-header {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        #gallery-viewer-close {
            background: transparent;
            border: none;
            color: var(--text);
            -webkit-text-fill-color: var(--text);
            font-size: 16px;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
        }

        #gallery-viewer-count {
            flex: 1;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: var(--muted);
            -webkit-text-fill-color: var(--muted);
            text-align: right;
        }

        #gallery-viewer-stage {
            flex: 1;
            position: relative;
            overflow: hidden;
            touch-action: pan-y;
        }

        #gallery-viewer-stage img,
        #gallery-viewer-stage video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: var(--bg);
        }

        #gallery-viewer-actions {
            flex: 0 0 auto;
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
        }

        #gallery-viewer-actions .btn {
            width: auto;
            flex: 1;
            margin-bottom: 0;
        }

        /* Gallery FAB shows the latest capture as a thumbnail, like a phone camera's
           roll shortcut, once there's at least one. */
        #mob-gallery.has-thumb {
            padding: 0;
            overflow: hidden;
        }

        #mob-gallery.has-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Export preview modal */
        #export-modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 200;
            background: rgba(0, 0, 0, 0.35);
            -webkit-backdrop-filter: blur(10px) saturate(120%);
            backdrop-filter: blur(10px) saturate(120%);
        }

        #export-modal.open {
            display: flex;
        }

        .export-modal-card {
            width: min(920px, 100%);
            max-height: min(88vh, 900px);
            background: rgba(255, 255, 255, 0.72);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            backdrop-filter: blur(14px) saturate(140%);
            border: 1px solid var(--border);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
        }

        /* top bar removed */
        .export-modal-top {
            display: none;
        }

        .export-modal-title {
            display: none;
        }

        .export-modal-body {
            padding: 14px;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.25);
        }

        #export-preview-canvas {
            max-width: 100%;
            max-height: 70vh;
            width: auto;
            height: auto;
            image-rendering: pixelated;
            border: 1px solid rgba(0, 0, 0, 0.12);
            background: #fff;
        }

        #export-preview-video {
            max-width: 100%;
            max-height: 70vh;
            width: 100%;
            height: auto;
            border: 1px solid rgba(0, 0, 0, 0.12);
            background: #000;
        }

        .export-modal-actions {
            padding: 12px 14px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Action buttons: small, side-by-side, stay inside card */
        .export-modal-actions .btn {
            padding: 10px 12px;
            font-size: 10px;
            letter-spacing: .12em;
            text-transform: uppercase;
            min-width: 120px;
        }

        @media (max-width: 700px) {
            .export-modal-actions {
                justify-content: space-between;
                flex-wrap: nowrap;
            }

            .export-modal-actions .btn {
                min-width: 0;
                flex: 1;
            }
        }

        /* ───── Responsive breakpoints ───── */
        @media (max-width: 700px) {

            html,
            body {
                overflow: hidden;
                height: 100%
            }

            #app {
                flex-direction: column;
                height: 100dvh;
                overflow: hidden;
                /* Top dock is overlay (fixed), don't reserve space */
                padding-top: 0;
                box-sizing: border-box;
            }

            /* Canvas area fills the whole screen below the top bar (no white margins;
               nothing is reserved at the bottom anymore — every other control there is a
               floating overlay, not part of layout flow) */
            #main {
                position: fixed;
                top: 36px;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 0;
                height: auto;
                min-height: 0;
            }

            #grid-canvas {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }

            /* Panel becomes a sliding drawer from the top, right below the toggle bar */
            #panel {
                position: fixed;
                top: 36px;
                left: 0;
                right: 0;
                width: 100%;
                min-width: unset;
                max-height: 0;
                overflow: hidden;
                border-right: none;
                z-index: 90;
                transition: max-height .35s cubic-bezier(.4, 0, .2, 1)
            }

            #panel.panel-open {
                max-height: 40vh;
                overflow-y: auto;
                /* Always sit above every floating control (mode header, shutter, zoom, etc.) */
                z-index: 200;
                /* Frosted glass panel (readable over Live) */
                background: rgba(255, 255, 255, 0.3);
                -webkit-backdrop-filter: blur(14px) saturate(140%);
                backdrop-filter: blur(14px) saturate(140%);
                isolation: isolate;
                color: var(--text);
            }

            #panel.panel-open .sec-label,
            #panel.panel-open .sl-label,
            #panel.panel-open .sl-val,
            #panel.panel-open label,
            #panel.panel-open input:not([type="range"]),
            #panel.panel-open .sec-num {
                color: var(--text);
            }

            #panel.panel-open .mob-fm-btn:not(.active) {
                color: var(--text);
            }

            #panel.panel-open::before {
                content: '';
                position: fixed;
                top: 36px;
                left: 0;
                right: 0;
                bottom: 0;
                /* subtle dim behind the frosted panel */
                background: rgba(0, 0, 0, 0.06);
                z-index: -1;
                pointer-events: none;
            }

            #panel.panel-open>* {
                position: relative;
                z-index: 1;
            }

            #panel.panel-open .section {
                background: rgba(255, 255, 255, 0.18);
            }

            /* הקנבס נשאר קבוע במקום ובגודל שלו; הפאנל הוא overlay שקוף-למחצה
               שעולה מעליו ויורד, ולא שינוי פריסה שדוחף/מקטין אותו. */

            /* Show toggle bar */
            #panel-toggle-bar {
                display: flex
            }

            /* במובייל – בלי כפילות: Snapshot ו-Flip כבר בחוץ */
            #l-snapshot,
            #l-flip-cam {
                display: none !important;
            }

            /* Larger controls on mobile */
            .section {
                padding: 14px 16px
            }

            #panel-header {
                padding: 14px 16px 12px
            }

            #panel-header h1 {
                font-size: 14px
            }

            #panel-header p {
                font-size: 11px
            }

            .sec-label {
                font-size: 11px;
                margin-bottom: 10px
            }

            .sl-label {
                min-width: 64px;
                font-size: 11px
            }

            .sl-val {
                min-width: 36px;
                font-size: 11px
            }

            .slider-row {
                gap: 10px;
                margin-bottom: 10px
            }

            input[type=range]::-webkit-slider-thumb {
                width: 20px;
                height: 20px;
                border-radius: 0
            }

            .color-row label {
                font-size: 11px
            }

            input[type=color] {
                width: 40px;
                height: 32px
            }

            .fm-btn {
                padding: 12px 6px;
                font-size: 11px
            }

            /* במובייל: כפתורי Upload/Live רק ב-header העליון, לא בתפריט */
            .fill-mode-switcher {
                display: none
            }

            .btn {
                padding: 14px;
                font-size: 11px
            }

            .dz-text {
                font-size: 11px
            }

            /* Hide export section inside panel on mobile — FAB handles it */
            .section:has(#dl-both) {
                display: none
            }
        }

        /* Tablet / large phones: show mobile docks too (layout stays desktop) */
        @media (max-width: 1024px) {
            #panel-toggle-bar {
                display: flex;
            }
        }

        /* ─── Floating Action Button (mobile download / camera flip) ─── */
        /* ─── Mobile Camera Buttons ─── */

        /* Base: hidden on desktop — square, same stroke as panel */
        #mob-shutter,
        #mob-upload-more,
        #mob-flip,
        #mob-download,
        #mob-ratio,
        #mob-gallery {
            display: none;
            position: fixed;
            border-radius: 0;
            cursor: pointer;
            border: none;
            background: var(--fab-bg);
            transition: background .12s, transform .12s;
            z-index: 85
        }

        /* Upload's backdrop is the plain white canvas, not a camera feed — the FABs'
           translucent white would otherwise blend into it. Give them a real static shade
           there, with a darker one for hover/press (no drop shadows anywhere per design). */
        body.mode-upload #mob-gallery,
        body.mode-upload #mob-download,
        body.mode-upload #mob-upload-more {
            background: var(--panel);
        }

        body.mode-upload #mob-gallery:active,
        body.mode-upload #mob-download:active,
        body.mode-upload #mob-upload-more:active {
            background: var(--surface);
        }

        @media (hover: hover) {

            body.mode-upload #mob-gallery:hover,
            body.mode-upload #mob-download:hover,
            body.mode-upload #mob-upload-more:hover {
                background: var(--surface);
            }
        }

        #mob-shutter:active,
        #mob-upload-more:active,
        #mob-flip:active,
        #mob-download:active,
        #mob-ratio:active,
        #mob-gallery:active {
            transform: scale(.97)
        }

        /* Mode-row container: transparent — only the active label gets a pill background */
        #mob-capture-mode {
            border: none;
            box-shadow: none;
            background: transparent;
        }

        /* Shutter — גובה 58px, מרכז תחתון */
        #mob-shutter {
            width: 58px;
            height: 58px;
            left: 50%;
            transform: translateX(-50%);
            bottom: 20px
        }

        #mob-shutter:active {
            transform: translateX(-50%) scale(.88)
        }

        @media (hover:hover) {

            /* Keep centered on hover (don't lose translateX) */
            #mob-shutter:hover {
                transform: translateX(-50%) scale(1.02);
            }
        }

        /* Upload's shutter-equivalent — same size/position, an up-arrow instead of a
           capture circle, always available (even with an image already loaded) so there's
           a way to replace it. */
        #mob-upload-more {
            width: 44px;
            height: 44px;
            left: 50%;
            transform: translateX(-50%);
            bottom: 27px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-size: 18px;
            line-height: 1;
            color: var(--text);
        }

        #mob-upload-more:active {
            transform: translateX(-50%) scale(.88)
        }

        @media (hover:hover) {

            #mob-upload-more:hover {
                transform: translateX(-50%) scale(1.02);
            }
        }

        /* Inner square — smaller, centered, with clear gap from outer frame */
        #mob-shutter::before {
            content: '';
            position: absolute;
            inset: 12px;
            border-radius: 0;
            border: 1px solid var(--border)
        }

        /* Recording state — inner square filled red */
        /* Video mode selected (idle) — same red as actually recording, so the shutter
           itself hints what tapping it will do, like a phone camera. */
        #mob-shutter.mode-video::before,
        #mob-shutter.recording::before {
            background: #ff2b2b;
            border-color: #ff2b2b
        }

        /* Actively recording — an orange ring around the shutter, gone the moment it stops.
           A real border, not a box-shadow (no drop shadows anywhere in this UI). */
        #mob-shutter.recording {
            border: 3px solid #ff9500;
        }

        /* Flip camera — same row as the shutter, right side (Live mobile) */
        #mob-flip {
            width: 40px;
            height: 40px;
            bottom: 29px;
            right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0
        }

        /* Gallery — same row as the shutter, left side (Live only) */
        #mob-gallery {
            width: 40px;
            height: 40px;
            bottom: 29px;
            left: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-size: 16px;
        }

        #mob-flip img {
            display: block;
            object-fit: contain
        }

        /* Photo/Video mode row — centered, just above the shutter, like a phone camera's
           mode strip. Tap either label or swipe the viewfinder to switch. */
        #mob-capture-mode {
            display: none;
            position: fixed;
            left: 50%;
            bottom: 84px;
            transform: translateX(-50%);
            z-index: 86;
            gap: 10px;
            align-items: center;
        }

        .mob-mode-label {
            border: none;
            border-radius: 0;
            padding: 5px 10px;
            background: transparent;
            cursor: pointer;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            font-family: 'IBM Plex Mono', monospace;
            color: #fff;
            -webkit-text-fill-color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
            opacity: .85;
            transition: background .15s, color .15s, opacity .15s;
        }

        /* Upload's backdrop is the plain white canvas, not a camera feed — labels need
           dark text there instead of white-on-shadow, and a real shade behind them
           (instead of relying on a shadow/stroke) so they read against the white canvas. */
        #mob-capture-mode.on-light-bg .mob-mode-label:not(.active) {
            color: var(--muted);
            -webkit-text-fill-color: var(--muted);
            text-shadow: none;
            background: var(--panel);
        }

        #mob-capture-mode.on-light-bg .mob-mode-label.active {
            background: var(--surface);
        }

        @media (hover: hover) {

            #mob-capture-mode.on-light-bg .mob-mode-label:not(.active):hover {
                background: var(--surface);
            }
        }

        .mob-mode-label.active {
            background: var(--fab-bg);
            color: var(--zoom-accent);
            -webkit-text-fill-color: var(--zoom-accent);
            text-shadow: none;
            opacity: 1;
        }

        /* Quick zoom presets — small taps for common levels, above the mode row */
        #mob-zoom-presets {
            display: none;
            position: fixed;
            left: 50%;
            bottom: 120px;
            transform: translateX(-50%);
            z-index: 86;
            gap: 8px;
            align-items: center;
        }

        .mob-zoom-preset {
            border: none;
            border-radius: 0;
            width: 26px;
            height: 26px;
            padding: 0;
            background: transparent;
            cursor: pointer;
            font-size: 10px;
            font-weight: 700;
            font-family: 'IBM Plex Mono', monospace;
            color: #fff;
            -webkit-text-fill-color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
            opacity: .85;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mob-zoom-preset.active {
            background: var(--fab-bg);
            color: var(--zoom-accent);
            -webkit-text-fill-color: var(--zoom-accent);
            text-shadow: none;
            opacity: 1;
        }

        /* Download — bottom-left (Upload; Live uses preview modal) */
        /* Same row, same size as flip/gallery on every screen (Upload here; Live uses
           the preview modal instead, per downloadPixels()'s caller). */
        #mob-download {
            width: 40px;
            height: 40px;
            bottom: 29px;
            left: auto;
            right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            /* Must stay above the sliding panel when it's open */
            z-index: 130
        }

        /* Download icon (arrow down) */
        #mob-download::before {
            content: '↓';
            font-size: 20px;
            line-height: 1;
            color: var(--border)
        }

        /* Live zoom dial — hidden until a two-finger pinch on the viewfinder reveals it,
           centered like a phone camera's zoom ruler. No visible trigger button for it. */
        #mob-zoom-pop {
            position: fixed;
            left: 50%;
            bottom: 32px;
            transform: translateX(-50%);
            width: 240px;
            height: 172px;
            padding: 0;
            border: none;
            background: transparent;
            z-index: 141;
        }

        /* While the zoom dial is open, everything else on the viewfinder gets out of the
           way — same as a phone camera hides its other controls while you pinch-zoom. */
        body.zoom-dial-active #mob-shutter,
        body.zoom-dial-active #mob-flip,
        body.zoom-dial-active #mob-capture-mode,
        body.zoom-dial-active #mob-download,
        body.zoom-dial-active #mob-ratio,
        body.zoom-dial-active #mob-zoom-presets,
        body.zoom-dial-active #mob-gallery,
        body.zoom-dial-active #panel-toggle-bar {
            display: none !important;
        }

        /* Curved zoom dial: a ruler bent along an arc, dragged directly (no native
           slider) — deliberately different from the app's square controls elsewhere,
           so it clearly reads as a camera-style zoom wheel. */
        #mob-zoom-dial {
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        #mob-zoom-dial-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 20px;
            font-weight: 800;
            fill: var(--zoom-accent);
        }

        /* Aspect ratio — top-right, Live only (on mobile below mode header) */
        #mob-ratio {
            width: 44px;
            height: 44px;
            top: 60px;
            right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        #mob-ratio img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        @media (max-width: 700px) {

            /* Export section still hidden in panel on mobile */
            .section:has(#dl-pixels) {
                display: none
            }
        }

        @media (min-width: 701px) and (max-width: 1024px) {

            /* Tablet — narrower panel */
            #panel {
                width: 220px;
                min-width: 200px
            }
        }

        /* מסך הזמנה להוספה למסך הבית (מובייל, בפתיחה מהקישור) */
        #install-prompt {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            font-family: 'IBM Plex Mono', monospace;
        }

        #install-prompt.show {
            display: flex;
        }

        #install-prompt h2 {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        #install-prompt p {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 20px;
            max-width: 280px;
        }

        #install-prompt .install-btn {
            padding: 14px 24px;
            border: none;
            background: var(--text);
            color: var(--bg);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'IBM Plex Mono', monospace;
            margin-bottom: 10px;
        }

        #install-prompt .skip-btn {
            background: transparent;
            color: var(--muted);
            border: none;
            font-size: 10px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <!-- Add to home screen prompt (shown on mobile when opening from link) -->
    <div id="install-prompt" aria-hidden="true">
        <h2>Pixelart Maker</h2>
        <p>Add a shortcut to your home screen to open the app from your icon.</p>
        <button type="button" class="install-btn" id="install-prompt-btn">Add to Home Screen</button>
        <p id="install-manual-hint"
            style="display:none; font-size:11px; margin-top:10px; color:var(--text); font-weight:600;"></p>
        <button type="button" class="skip-btn" id="install-prompt-skip">Continue to app</button>
    </div>
    <!-- Recording timer — shown only while actively recording video -->
    <div id="mob-rec-timer" aria-hidden="true">00:00</div>
    <!-- Mobile bottom bar -->
    <div id="panel-toggle-bar">
        <span>Pixelart Maker</span>
        <button id="panel-toggle-btn" aria-label="Toggle controls">☰</button>
    </div>

    <!-- Mobile camera controls -->
    <!-- Shutter: big circle at bottom center -->
    <button id="mob-shutter" aria-label="Capture"></button>
    <!-- Upload mode's equivalent of the shutter: always available (even once an image is
         already loaded) so there's a way to pick another one and replace it. -->
    <button id="mob-upload-more" aria-label="Upload image" type="button" style="display:none">↑</button>
    <!-- Aspect ratio: top, Live only -->
    <button id="mob-ratio" aria-label="Aspect ratio" type="button" style="display:none">
        <img src="ratio_icon.png" alt="" width="22" height="22">
    </button>
    <!-- Camera flip: small circle -->
    <button id="mob-flip" aria-label="Flip camera" style="display:none">
        <img src="camera-switch.svg" alt="" width="22" height="22">
    </button>
    <!-- Camera rotate: cycles 0/90/180/270 -->
    <button id="mob-rotate-cam" aria-label="Rotate camera" type="button"
        style="display:none; position:fixed; width:44px; height:44px; bottom:86px; right:70px; z-index:85; border:1px solid #000; background:#fff; font-size:20px; line-height:1; cursor:pointer; border-radius:0;">↻</button>
    <!-- Photo/Video mode: two labels, the active one lit up. Swiping the viewfinder or
         tapping either label switches between them. Flip camera and Gallery flank it,
         same row (Live only). -->
    <div id="mob-capture-mode" style="display:none">
        <button type="button" class="mob-mode-label" data-cap-mode="video">Video</button>
        <button type="button" class="mob-mode-label active" data-cap-mode="image">Photo</button>
        <button type="button" class="mob-mode-label" data-app-mode="image">Upload</button>
    </div>
    <button id="mob-gallery" aria-label="Gallery" type="button" style="display:none">▦</button>
    <button id="mob-download" aria-label="Download"></button>
    <!-- Quick zoom presets — small taps for common levels, above the shutter (Live only). -->
    <div id="mob-zoom-presets" style="display:none"></div>
    <!-- Live Zoom: pinch with two fingers on the viewfinder (Live only) to reveal this
         curved drag-to-zoom dial, like a phone camera — no visible button for it. -->
    <div id="mob-zoom-pop" aria-hidden="true" style="display:none">
        <svg id="mob-zoom-dial" viewBox="0 0 240 172" width="240" height="172" role="slider"
            aria-label="Zoom level" aria-valuemin="1" aria-valuemax="2" aria-valuenow="1">
            <g id="mob-zoom-ticks-g"></g>
            <text id="mob-zoom-dial-label" x="120" y="150" text-anchor="middle">1×</text>
        </svg>
    </div>

    <!-- Gallery: every photo/video captured this session. Tap a thumbnail to select it,
         then Download or Delete. Nothing here survives a reload (same no-persistence rule
         as the rest of the app) — it's an in-memory session roll, not storage. -->
    <div id="gallery-screen" aria-hidden="true" style="display:none">
        <div id="gallery-header">
            <button type="button" id="gallery-close" aria-label="Close gallery">✕</button>
            <span id="gallery-title">GALLERY</span>
            <span id="gallery-count"></span>
        </div>
        <div id="gallery-grid"></div>
        <div id="gallery-empty" style="display:none">No captures yet</div>
        <div id="gallery-actions">
            <button type="button" class="btn btn-outline" id="gallery-delete" disabled>Delete</button>
            <button type="button" class="btn btn-fill" id="gallery-download" disabled>Download</button>
        </div>
    </div>

    <!-- Single-item viewer: opened by tapping a thumbnail (not its selection circle).
         Swipe left/right to move between captures. -->
    <div id="gallery-viewer" aria-hidden="true" style="display:none">
        <div id="gallery-viewer-header">
            <button type="button" id="gallery-viewer-close" aria-label="Close">✕</button>
            <span id="gallery-viewer-count"></span>
        </div>
        <div id="gallery-viewer-stage"></div>
        <div id="gallery-viewer-actions">
            <button type="button" class="btn btn-outline" id="gallery-viewer-delete">Delete</button>
            <button type="button" class="btn btn-fill" id="gallery-viewer-download">Download</button>
        </div>
    </div>

    <div id="app">
        <aside id="panel">
            <div id="panel-header">
                <h1>Pixel Art Maker</h1>
            </div>

            <!-- Mode switch (desktop): keep first in panel -->
            <div class="section desktop-mode-switch">
                <div id="fill-mode" style="display:flex">
                    <button class="fm-btn" id="fm-image" style="flex:1">Upload</button>
                    <button class="fm-btn active" id="fm-live" style="flex:1">Live</button>
                </div>
            </div>

            <!-- 01 Resolution -->
            <div class="section">
                <div class="slider-row">
                    <span class="sec-label"><span class="sec-num">01</span> Resolution</span>
                    <input type="range" id="g-res" min="8" max="300" value="250" />

            <canvas id="grid-canvas"></canvas>
