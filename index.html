        // ═══════════════════════════════════════════════════
        let __pendingExport = null; // { type: 'image', canvas, filename } | { type: 'video', blob, filename, mimeType, url }
        let __exportModalWired = false;

        function closeExportModal() {
            const modal = document.getElementById('export-modal');
            const prev = document.getElementById('export-preview-canvas');
            const prevVid = document.getElementById('export-preview-video');
            if (!modal) return;
            modal.classList.remove('open');
            modal.setAttribute('aria-hidden', 'true');

            if (prevVid) {
                try { prevVid.pause(); } catch (_) { }
                prevVid.removeAttribute('src');
                prevVid.style.display = 'none';
            }
            if (prev) prev.style.display = 'block';

            if (__pendingExport && __pendingExport.type === 'video') {
                try { URL.revokeObjectURL(__pendingExport.url); } catch (_) { }
            }
            __pendingExport = null;
        }

        function ensureExportModalWired() {
            if (__exportModalWired) return;
            __exportModalWired = true;
            const modal = document.getElementById('export-modal');
            const closeBtn = document.getElementById('export-close');
            const okBtn = document.getElementById('export-confirm');
            if (!modal || !closeBtn || !okBtn) return;

            closeBtn.addEventListener('click', closeExportModal);
            modal.addEventListener('click', (e) => { if (e.target === modal) closeExportModal(); });
            okBtn.addEventListener('click', () => {
                if (!__pendingExport) return;
                if (__pendingExport.type === 'image') {
                    dl(__pendingExport.canvas, __pendingExport.filename);
                    closeExportModal();
                    return;
                }
                if (__pendingExport.type === 'video') {
                    const blob = __pendingExport.blob;
                    const fileName = __pendingExport.filename;
                    const mimeType = __pendingExport.mimeType || 'video/webm';
                    const file = new File([blob], fileName, { type: mimeType });
                    const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth <= 700;
                    if (isMobile && navigator.canShare && navigator.canShare({ files: [file] })) {
                        navigator.share({ files: [file], title: 'Pixel Art Maker Video' }).catch(function () {
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = fileName;
                            a.click();
                            setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
                        }).finally(closeExportModal);
                    } else {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileName;
                        a.click();
                        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
                        closeExportModal();
                    }
                }
            });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeExportModal(); });
        }

        function openExportPreview(canvas, filename) {
            const modal = document.getElementById('export-modal');
            const prev = document.getElementById('export-preview-canvas');
            const prevVid = document.getElementById('export-preview-video');
            if (!modal || !prev) { dl(canvas, filename); return; }
            ensureExportModalWired();

            __pendingExport = { type: 'image', canvas, filename };
            if (prevVid) {
                try { prevVid.pause(); } catch (_) { }
                prevVid.removeAttribute('src');
                prevVid.style.display = 'none';
            }
            prev.style.display = 'block';
            prev.width = canvas.width;
            prev.height = canvas.height;
            const pctx = prev.getContext('2d');
            pctx.imageSmoothingEnabled = false;
            pctx.clearRect(0, 0, prev.width, prev.height);
            pctx.drawImage(canvas, 0, 0);

            modal.classList.add('open');
            modal.setAttribute('aria-hidden', 'false');
        }

        function openVideoExportPreview(blob, filename, mimeType) {
            const modal = document.getElementById('export-modal');
            const prev = document.getElementById('export-preview-canvas');
            const prevVid = document.getElementById('export-preview-video');
            if (!modal || !prevVid) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
                return;
            }
            ensureExportModalWired();

            if (prev) prev.style.display = 'none';
            const url = URL.createObjectURL(blob);
            __pendingExport = { type: 'video', blob, filename, mimeType: mimeType || 'video/webm', url };
            prevVid.style.display = 'block';
            prevVid.src = url;
            try { prevVid.currentTime = 0; } catch (_) { }

            modal.classList.add('open');
            modal.setAttribute('aria-hidden', 'false');
        }

        function openBlobInTab(blob) {
            const url = URL.createObjectURL(blob);
            const w = window.open(url, '_blank');
            if (!w) {
                // Popup blocked — use location fallback
                window.location.href = url;
            }
            setTimeout(() => URL.revokeObjectURL(url), 60000);
        }

        function renderHiRes(includeFill, includeHighlight, includeStroke, solidBg) {
            const gap = state.gap;
            const longerSide = Math.max(state.cols, state.rows);
            const scale = Math.max(1, Math.ceil(EXPORT_MIN_PX / longerSide));
            const cs = scale, strokeW = state.strokeW * scale, gapS = gap * scale;
            const W = state.cols * cs + (state.cols - 1) * gapS, H = state.rows * cs + (state.rows - 1) * gapS;
            const r = cs / 2 * .92;
            const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
            const tc = tmp.getContext('2d');
            if (solidBg) { tc.fillStyle = state.bg; tc.fillRect(0, 0, W, H); }
            for (let row = 0; row < state.rows; row++) {
                for (let col = 0; col < state.cols; col++) {
                    const cx = col * (cs + gapS) + cs / 2, cy = row * (cs + gapS) + cs / 2;
                    const cellColor = state.cells[row][col];
                    tracePath(tc, cx, cy, r, r);
                    if (cellColor !== null && includeFill) {
                        tc.fillStyle = cellColor; tc.fill();
                    }
                    if (includeStroke) { tc.strokeStyle = state.strokeCol; tc.lineWidth = strokeW; tc.stroke(); }
                }
            }
            return tmp;
        }

        // Returns { w, h } for canvas: w = horizontal pixels, h = vertical. Portrait (9:16) = narrow×tall.
        function getExportDimensionsForRatio(ratioKey) {
            var k = String(ratioKey || '9:16').trim();
            switch (k) {
                case '9:16': return { w: 1080, h: 1920 };
                case '4:5': return { w: 1536, h: 1920 };
                case '1:1': return { w: 1920, h: 1920 };
                case '16:9': return { w: 1920, h: 1080 };
                case '3:4': return { w: 1440, h: 1920 };
                default: return { w: 1080, h: 1920 };
            }
        }

        function renderHiResForRatio(ratioKey, includeFill, solidBg) {
            var dim = getExportDimensionsForRatio(ratioKey);
            var cnv = document.createElement('canvas');
            cnv.width = dim.w;
            cnv.height = dim.h;
            var ctx = cnv.getContext('2d');
            if (solidBg) { ctx.fillStyle = state.bg; ctx.fillRect(0, 0, dim.w, dim.h); }
            drawGridToContext(ctx, dim.w, dim.h);
            return cnv;
        }

        // Download = הקנבס עצמו: ב-Live העתקה של liveCoverCanvas, ב-Upload יחס הגריד
        function downloadPixels() {
            var cnv;
            if (state.mode === 'live' && liveCoverCanvas && liveCoverCanvas.width > 0 && liveCoverCanvas.height > 0) {
                cnv = document.createElement('canvas');
                cnv.width = liveCoverCanvas.width;
                cnv.height = liveCoverCanvas.height;
                cnv.getContext('2d').drawImage(liveCoverCanvas, 0, 0);
            } else {
                cnv = document.createElement('canvas');
                var ctx = cnv.getContext('2d');
                var cols = state.cols, rows = state.rows;
                var longSide = 1920;
                var ratio = cols / rows;
                if (ratio >= 1) {
                    cnv.width = longSide;
                    cnv.height = Math.round(longSide / ratio);
                } else {
                    cnv.width = Math.round(longSide * ratio);
                    cnv.height = longSide;
                }
                ctx.fillStyle = state.bg;
                ctx.fillRect(0, 0, cnv.width, cnv.height);
                drawGridToContext(ctx, cnv.width, cnv.height);
            }
            openExportPreview(cnv, `pixel_art_maker_${Date.now()}.png`);
        }
        document.getElementById('dl-pixels').addEventListener('click', downloadPixels);
        document.getElementById('btn-clear').addEventListener('click', () => { resetCells(); renderGrid(); });

        // ═══════════════════════════════════════════════════
        //  LIVE CAMERA
        // ═══════════════════════════════════════════════════
        const liveVideo = document.createElement('video');
        liveVideo.autoplay = true; liveVideo.muted = true; liveVideo.playsInline = true;
        liveVideo.style.display = 'none'; document.body.appendChild(liveVideo);

        const liveState = {
            stream: null, rafId: null,
            res: 250, threshold: 132, bgCut: 255, edge: 10,
            fillCol: '#000000', fillCol2: '#888888', strokeCol: '#000000', bgCol: '#ffffff',
            mirror: true,
            bgPixels: null, bgCols: 0, bgRows: 0, bgDiff: 30,
            facingMode: 'user',
            aspectRatio: '9:16',
            userZoom: 1, // user-controlled zoom (hardware if available, else software)
            userSetFacing: false,
            didSetMobileFacingDefault: false,
            didSetMobileZoomDefault: false,
            didApplyMobileHardwareZoomDefault: false,
        };

        // Single source of truth: target preview ratio by breakpoint.
        // - mobile: 9:16 (portrait)
        // - tablet: 3:4 (portrait-ish)
        // - desktop: 9:16 (portrait, per request; keeps behavior consistent across devices)
        function getLiveTargetRatioKey() {
            const mode = getLayoutMode();
            if (mode === 'tablet') return '3:4';
            return '9:16';
        }

        function getLiveTargetRatioValue() {
            return getAspectRatioValue(getLiveTargetRatioKey());
        }

        function getAspectRatioValue(ratioKey) {
            if (ratioKey === '1:1') return 1;
            if (ratioKey === '3:4') return 3 / 4;
            if (ratioKey === '4:5') return 4 / 5;
            if (ratioKey === '16:9') return 16 / 9;
            return 9 / 16; // '9:16' default
        }

        // Same as LIVE_EXPORT_DIMENSIONS – export = exactly what’s on screen
        function getLiveCoverDimensions(ratioKey) {
            var k = String(ratioKey || '9:16').trim();
            return LIVE_EXPORT_DIMENSIONS[k] || LIVE_EXPORT_DIMENSIONS['9:16'];
        }

        const liveOffC = document.createElement('canvas');
        const liveOffX = liveOffC.getContext('2d');
        const liveRotC = document.createElement('canvas');
        const liveRotX = liveRotC.getContext('2d');
        let __liveDebug = null;
        let __liveTrackDebug = null;
        let __liveZoomCaps = null;
        let __liveZoomRange = { min: 1, max: 2, step: 0.01 };

        function ensureLiveOptionsUI() {
            // Zoom UI is handled by the floating button on mobile.
            // Keep live-options minimal/empty.
            const box = document.getElementById('live-options');
            if (!box) return;
            if (box.__wired) return;
            box.__wired = true;
            box.innerHTML = '';
        }

        function computeLiveZoomRange() {
            // max zoom-in requested: 2x
            const cap = __liveZoomCaps;
            const minCap = (cap && typeof cap.min === 'number') ? cap.min : 1;
            const maxCap = (cap && typeof cap.max === 'number') ? cap.max : 2;
            const stepCap = (cap && typeof cap.step === 'number') ? cap.step : 0.01;
            const min = Math.max(0.1, minCap);
            const max = Math.max(min, Math.min(2, maxCap));
            const step = Math.max(0.01, stepCap);
            __liveZoomRange = { min, max, step };
        }

        // ── Curved zoom dial geometry ───────────────────────
        // A ruler bent along an arc, like a phone camera's zoom control: the circle's
        // center sits below the visible SVG box, so only its top "dome" shows. Low zoom
        // is on the left (near ANGLE_MAX, standard math angle), high zoom on the right
        // (near ANGLE_MIN) — angle decreases as the value increases.
        const ZOOM_DIAL_CX = 120, ZOOM_DIAL_CY = 134, ZOOM_DIAL_R = 119;
        const ZOOM_DIAL_ANGLE_MIN = 15, ZOOM_DIAL_ANGLE_MAX = 165;

        function zoomValueToAngle(v, min, max) {
            const t = max > min ? (v - min) / (max - min) : 0;
            return ZOOM_DIAL_ANGLE_MAX - Math.max(0, Math.min(1, t)) * (ZOOM_DIAL_ANGLE_MAX - ZOOM_DIAL_ANGLE_MIN);
        }
        function zoomAngleToValue(angle, min, max) {
            const t = (ZOOM_DIAL_ANGLE_MAX - angle) / (ZOOM_DIAL_ANGLE_MAX - ZOOM_DIAL_ANGLE_MIN);
            return min + Math.max(0, Math.min(1, t)) * (max - min);
        }
        function zoomAnglePoint(angleDeg, radius) {
            const rad = angleDeg * Math.PI / 180;
            return { x: ZOOM_DIAL_CX + radius * Math.cos(rad), y: ZOOM_DIAL_CY - radius * Math.sin(rad) };
        }

        function renderZoomTicks() {
            const g = document.getElementById('mob-zoom-ticks-g');
            const dial = document.getElementById('mob-zoom-dial');
            if (!g) return;
            const { min, max } = __liveZoomRange || { min: 1, max: 2 };
            if (dial) {
                dial.setAttribute('aria-valuemin', String(min));
                dial.setAttribute('aria-valuemax', String(max));
            }
            const NUM_TICKS = 20;
            const p0 = zoomAnglePoint(ZOOM_DIAL_ANGLE_MIN, ZOOM_DIAL_R);
            const p1 = zoomAnglePoint(ZOOM_DIAL_ANGLE_MAX, ZOOM_DIAL_R);
            let svg = `<path d="M ${p0.x.toFixed(1)} ${p0.y.toFixed(1)} A ${ZOOM_DIAL_R} ${ZOOM_DIAL_R} 0 0 0 ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.5" />`;
            for (let i = 0; i <= NUM_TICKS; i++) {
                const t = i / NUM_TICKS;
                const v = min + t * (max - min);
                const angle = zoomValueToAngle(v, min, max);
                const isMajor = (i % 4 === 0);
                const rInner = ZOOM_DIAL_R - (isMajor ? 16 : 9);
                const po = zoomAnglePoint(angle, ZOOM_DIAL_R);
                const pi = zoomAnglePoint(angle, rInner);
                svg += `<line x1="${po.x.toFixed(1)}" y1="${po.y.toFixed(1)}" x2="${pi.x.toFixed(1)}" y2="${pi.y.toFixed(1)}" stroke="var(--text)" stroke-width="${isMajor ? 1.6 : 1}" opacity="${isMajor ? 0.85 : 0.4}" />`;
                if (isMajor) {
                    const pl = zoomAnglePoint(angle, ZOOM_DIAL_R - 28);
                    const label = v < 1 ? v.toFixed(1) : String(Math.round(v * 10) / 10).replace(/\.0$/, '');
                    svg += `<text x="${pl.x.toFixed(1)}" y="${pl.y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="10" font-family="'IBM Plex Mono', monospace" fill="var(--muted)">${label}×</text>`;
                }
            }
            g.innerHTML = svg;
            updateZoomDialIndicator(liveState.userZoom || min);
        }

        function updateZoomDialIndicator(value) {
            const g = document.getElementById('mob-zoom-ticks-g');
            const dial = document.getElementById('mob-zoom-dial');
            if (!g) return;
            const { min, max } = __liveZoomRange || { min: 1, max: 2 };
            const v = Math.max(min, Math.min(max, value));
            const angle = zoomValueToAngle(v, min, max);
            const old = document.getElementById('mob-zoom-indicator');
            if (old) old.remove();
            const po = zoomAnglePoint(angle, ZOOM_DIAL_R + 5);
            const pi = zoomAnglePoint(angle, ZOOM_DIAL_R - 20);
            const ns = 'http://www.w3.org/2000/svg';
            const ind = document.createElementNS(ns, 'g');
            ind.id = 'mob-zoom-indicator';
            const line = document.createElementNS(ns, 'line');
            line.setAttribute('x1', po.x); line.setAttribute('y1', po.y);
            line.setAttribute('x2', pi.x); line.setAttribute('y2', pi.y);
            line.setAttribute('stroke', 'var(--zoom-accent)');
            line.setAttribute('stroke-width', '2.5');
            ind.appendChild(line);
            const dot = document.createElementNS(ns, 'circle');
            dot.setAttribute('cx', String(po.x)); dot.setAttribute('cy', String(po.y));
            dot.setAttribute('r', '4');
            dot.setAttribute('fill', 'var(--zoom-accent)');
            ind.appendChild(dot);
            g.appendChild(ind);

            if (dial) dial.setAttribute('aria-valuenow', v.toFixed(2));
            const label = document.getElementById('mob-zoom-dial-label');
            if (label) {
                let s = v.toFixed(2);
                if (s.indexOf('.') !== -1) s = s.replace(/0+$/, '').replace(/\.$/, '');
                label.textContent = s + '×';
            }
        }

        function setZoomUIValue(val) {
            const r = __liveZoomRange || { min: 1, max: 2 };
            const z = Math.max(r.min, Math.min(r.max, Number(val) || 1));
            liveState.userZoom = z;
            let zStr = z.toFixed(2);
            if (zStr.indexOf('.') !== -1) zStr = zStr.replace(/0+$/, '').replace(/\.$/, '');
            const valEl = document.getElementById('mob-zoom-val');
            if (valEl) valEl.textContent = zStr + '×';
            updateZoomDialIndicator(z);
        }

        function applyHardwareZoomIfPossible(val) {
            try {
                const vt = liveState.stream && liveState.stream.getVideoTracks ? liveState.stream.getVideoTracks()[0] : null;
                const caps = __liveZoomCaps;
                if (!vt || !caps || typeof vt.applyConstraints !== 'function') return;
                const zmin = (typeof caps.min === 'number') ? caps.min : 1;
                const zmax = (typeof caps.max === 'number') ? caps.max : 1;
                if (val >= zmin && val <= zmax) {
                    vt.applyConstraints({ advanced: [{ zoom: val }] }).catch(() => { });
                }
            } catch (_) { }
        }

        function wireMobileZoomUI() {
            const fab = document.getElementById('mob-zoom');
            const pop = document.getElementById('mob-zoom-pop');
            const dial = document.getElementById('mob-zoom-dial');
            if (!fab || !pop || !dial) return;
            if (fab.__wired) return;
            fab.__wired = true;

            function openPop() { pop.style.display = 'flex'; pop.setAttribute('aria-hidden', 'false'); }
            function closePop() { pop.style.display = 'none'; pop.setAttribute('aria-hidden', 'true'); }
            function togglePop() { (pop.style.display === 'flex') ? closePop() : openPop(); }

            fab.addEventListener('click', (e) => { e.stopPropagation(); togglePop(); });
            document.addEventListener('click', (e) => {
                if (pop.style.display !== 'flex') return;
                if (e.target === pop || pop.contains(e.target) || e.target === fab) return;
                closePop();
            });

            // Drag anywhere on the dial — the angle from its center to your finger maps to
            // a zoom value, updated (and applied to the camera) live as you move, not just
            // on release.
            let dragging = false;
            function pointToZoom(clientX, clientY) {
                const rect = dial.getBoundingClientRect();
                if (!rect.width || !rect.height) return;
                const x = (clientX - rect.left) * (240 / rect.width);
                const y = (clientY - rect.top) * (172 / rect.height);
                const dx = x - ZOOM_DIAL_CX, dy = ZOOM_DIAL_CY - y;
                let angle = Math.atan2(dy, dx) * 180 / Math.PI;
                angle = Math.max(ZOOM_DIAL_ANGLE_MIN, Math.min(ZOOM_DIAL_ANGLE_MAX, angle));
                const { min, max } = __liveZoomRange || { min: 1, max: 2 };
                const v = zoomAngleToValue(angle, min, max);
                setZoomUIValue(v);
                applyHardwareZoomIfPossible(v);
            }
            dial.addEventListener('pointerdown', (e) => {
                dragging = true;
                try { dial.setPointerCapture(e.pointerId); } catch (_) { }
                pointToZoom(e.clientX, e.clientY);
            });
            dial.addEventListener('pointermove', (e) => { if (dragging) pointToZoom(e.clientX, e.clientY); });
            dial.addEventListener('pointerup', (e) => {
                dragging = false;
                try { dial.releasePointerCapture(e.pointerId); } catch (_) { }
            });
            dial.addEventListener('pointercancel', () => { dragging = false; });

            setZoomUIValue(liveState.userZoom || 1);
            closePop();
        }

        function isIOSSafari() {
            const ua = navigator.userAgent || '';
            const isIOS = /iPad|iPhone|iPod/i.test(ua);
            const isWebKit = /WebKit/i.test(ua);
            const isCriOS = /CriOS/i.test(ua);
            const isFxiOS = /FxiOS/i.test(ua);
            const isSafari = isWebKit && /Safari/i.test(ua) && !isCriOS && !isFxiOS;
            return isIOS && isSafari;
        }

        function getScreenOrientationAngle() {
            // Prefer Screen Orientation API, fall back to legacy iOS window.orientation
            try {
                if (screen && screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
            } catch (_) { }
            const a = window.orientation;
            if (typeof a === 'number') return a;
            return 0;
        }

        function getMainAspectRatioFallback() {
            try {
                const mainEl = document.getElementById('main');
                if (mainEl) {
                    const r = mainEl.getBoundingClientRect();
                    if (r && r.width > 0 && r.height > 0) return r.width / r.height;
                }
            } catch (_) { }
            const w = window.innerWidth || 1;
            const h = window.innerHeight || 1;
            return w / h;
        }

        function getLiveVideoConstraints() {
            const mode = getLayoutMode();
            // Request a stream that matches our target ratio for this breakpoint.
            // Browsers may ignore, but when honored it prevents "stuck 16:9" on mobile.
            let desiredAR = getLiveTargetRatioValue(); // width/height, portrait < 1
            if (desiredAR > 1) desiredAR = 1 / desiredAR;

            // Choose a sensible ideal resolution per breakpoint (portrait).
            // (width/height are only "ideal", so devices can pick the closest supported.)
            const idealLong = (mode === 'desktop') ? 1920 : (mode === 'tablet' ? 1440 : 1280);
            const idealH = idealLong;
            const idealW = Math.max(360, Math.round(idealLong * desiredAR));

            return {
                facingMode: liveState.facingMode,
                width: { ideal: idealW },
                height: { ideal: idealH },
                aspectRatio: { ideal: desiredAR },
                advanced: [
                    { width: idealW, height: idealH },
                    { width: 720, height: 1280 },
                    { width: 1080, height: 1920 },
                ]
            };
        }

        function sampleLiveFrame() {
            if (!liveVideo.videoWidth) return null;
            const N = liveState.res;
            const vw = liveVideo.videoWidth, vh = liveVideo.videoHeight;
            const mode = getLayoutMode();

            // Grid ratio: always use the TARGET ratio (single source of truth),
            // so the preview stays stable across devices and camera quirks.
            let targetRatio = getLiveTargetRatioValue();
            if (targetRatio > 1) targetRatio = 1 / targetRatio;

            // Grid dimensions (cols × rows ≈ N²)
            const sqrtR = Math.sqrt(targetRatio);
            const cols = Math.max(2, Math.round(N * sqrtR));
            const rows = Math.max(2, Math.round(N / sqrtR));
            liveOffC.width = cols; liveOffC.height = rows;

            // Draw video into the downsampled canvas.
            // Always "contain": show the full camera frame (no crop) inside the target frame.
            // If iOS delivers a landscape buffer while UI is portrait, rotate for sampling.
            const wantPortraitUI = (targetRatio < 1) && (window.innerHeight >= window.innerWidth);
            // iOS Safari already applies rotation metadata when drawing the <video> element to canvas.
            // Rotating again causes a 90° sideways preview.
            const needsRotate = !isIOSSafari() && wantPortraitUI && (vw > vh);
            let srcEl = liveVideo;
            let sw = vw, sh = vh;
            if (needsRotate) {
                // Direction heuristics: front camera tends to need CW, back camera CCW.
                const dir = (liveState.facingMode === 'user') ? 1 : -1;
                sw = vh; sh = vw;
                liveRotC.width = sw;
                liveRotC.height = sh;
                liveRotX.save();
                liveRotX.clearRect(0, 0, sw, sh);
                liveRotX.translate(sw / 2, sh / 2);
                liveRotX.rotate(dir * (Math.PI / 2));
                liveRotX.drawImage(liveVideo, -vw / 2, -vh / 2, vw, vh);
                liveRotX.restore();
                srcEl = liveRotC;
            }

            const scaleMode = getLiveScaleMode();
            const containScale = Math.min(cols / sw, rows / sh);
            const coverScale = Math.max(cols / sw, rows / sh);
            // Zoom behavior (camera app): keep frame filled.
            // Zoom is >= 1: 1.0 = normal cover fill, >1 = zoom in (more crop).
            const z = Math.max(1, Math.min(8, liveState.userZoom || 1));
            let scale;
            if (scaleMode === 'cover') {
                scale = coverScale * z;
            } else {
                scale = containScale * z;
            }
            const drawW = sw * scale, drawH = sh * scale;
            const dstX = (cols - drawW) / 2, dstY = (rows - drawH) / 2;
            __liveDebug = { vw, vh, sw, sh, cols, rows, drawW: Math.round(drawW), drawH: Math.round(drawH), dstX: Math.round(dstX), dstY: Math.round(dstY), needsRotate: !!needsRotate, target: targetRatio };
            liveOffX.fillStyle = liveState.bgCol;
            liveOffX.fillRect(0, 0, cols, rows);
            if (liveState.mirror) {
                liveOffX.save();
                liveOffX.translate(dstX + drawW, dstY);
                liveOffX.scale(-1, 1);
                liveOffX.drawImage(srcEl, 0, 0, sw, sh, 0, 0, drawW, drawH);
                liveOffX.restore();
            } else {
                liveOffX.drawImage(srcEl, 0, 0, sw, sh, dstX, dstY, drawW, drawH);
            }

            return { px: liveOffX.getImageData(0, 0, cols, rows).data, cols, rows };
        }

        function liveLoop() {
            const frame = sampleLiveFrame();
            if (frame) {
                const { px, cols, rows } = frame;
                // Update grid dimensions if changed
                if (state.cols !== cols || state.rows !== rows) {
                    state.cols = cols; state.rows = rows;
                    state.cells = Array.from({ length: rows }, () => new Array(cols).fill(null));
                }
                const bgPx = liveState.bgPixels;
                const bgCols = liveState.bgCols;
                const bgRows = liveState.bgRows;
                const useSilhouette = bgPx !== null && bgCols === cols && bgRows === rows;

                const lum = edgeEnhanceLum(px, cols, rows, liveState.edge);
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const idx = r * cols + c;
                        const l = lum[idx];
                        const i = idx * 4;
                        const R = px[i], G = px[i + 1], B = px[i + 2];
                        if (useSilhouette) {
                            // Background subtraction: is this pixel foreground?
                            const dr = Math.abs(px[i] - bgPx[i]);
                            const dg = Math.abs(px[i + 1] - bgPx[i + 1]);
                            const db = Math.abs(px[i + 2] - bgPx[i + 2]);
                            const diff = (dr + dg + db) / 3;
                            if (diff <= liveState.bgDiff) { state.cells[r][c] = null; }
                            else { state.cells[r][c] = nearestPaletteColorRGB(R, G, B); }
                        } else {
                            const alpha = px[i + 3];
                            // Pixels brighter than BG Cutoff → background (null)
                            if (alpha <= 30 || l >= liveState.bgCut) { state.cells[r][c] = null; }
                            else { state.cells[r][c] = nearestPaletteColorRGB(R, G, B); }
                        }
                    }
                }
                state.bg = liveState.bgCol;
                state.strokeCol = liveState.strokeCol;
                state.fillCol = liveState.fillCol;
                renderGrid();
            }
            liveState.rafId = requestAnimationFrame(liveLoop);
        }

        async function startCamera() {
            try {
                // Mobile defaults (apply once, don't override user flip/zoom)
                if (isMobileLayout() && !liveState.userSetFacing && !liveState.didSetMobileFacingDefault) {
                    liveState.facingMode = 'environment';
                    liveState.mirror = false;
                    liveState.didSetMobileFacingDefault = true;
                }
                if (isMobileLayout() && !liveState.didSetMobileZoomDefault) {
                    // Set UI immediately; hardware zoom will be applied after stream starts.
                    setZoomUIValue(0.5);
                    liveState.didSetMobileZoomDefault = true;
                }
                // Sync Live ratio to breakpoint (single source of truth)
                liveState.aspectRatio = getLiveTargetRatioKey();
                liveCoverCanvas = null;
                liveCoverLastRatio = null;
                ensureLiveOptionsUI();
                wireMobileZoomUI();

                try {
                    // Ask for mic audio too (used by video recording); camera still works without it.
                    liveState.stream = await navigator.mediaDevices.getUserMedia({
                        video: getLiveVideoConstraints(), audio: true
                    });
                } catch (_) {
                    liveState.stream = await navigator.mediaDevices.getUserMedia({
                        video: getLiveVideoConstraints(), audio: false
                    });
                }
                liveVideo.srcObject = liveState.stream;
                await liveVideo.play();
                try {
                    const vt = liveState.stream && liveState.stream.getVideoTracks ? liveState.stream.getVideoTracks()[0] : null;
                    if (vt) {
                        const s = (typeof vt.getSettings === 'function') ? vt.getSettings() : null;
                        const c = (typeof vt.getConstraints === 'function') ? vt.getConstraints() : null;
                        const cap = (typeof vt.getCapabilities === 'function') ? vt.getCapabilities() : null;
                        __liveZoomCaps = (cap && cap.zoom) ? cap.zoom : null;
                        computeLiveZoomRange();
                        renderZoomTicks();
                        try {
                            // Apply preferred mobile zoom (0.5x) once; else keep current.
                            if (isMobileLayout() && !liveState.didApplyMobileHardwareZoomDefault && __liveZoomCaps && typeof __liveZoomCaps.min === 'number') {
                                const pref = 0.5;
                                const zmin = __liveZoomCaps.min;
                                const zmax = (typeof __liveZoomCaps.max === 'number') ? __liveZoomCaps.max : zmin;
                                const target = (pref >= zmin && pref <= zmax) ? pref : zmin;
                                setZoomUIValue(target);
                                applyHardwareZoomIfPossible(target);
                                liveState.didApplyMobileHardwareZoomDefault = true;
                            } else {
                                const cur = (s && typeof s.zoom === 'number') ? s.zoom : liveState.userZoom;
                                setZoomUIValue(cur || 1);
                            }
                        } catch (_) { }
                        __liveTrackDebug = { settings: s, constraints: c, capabilities: cap };
                    } else {
                        __liveTrackDebug = null;
                    }
                } catch (_) { __liveTrackDebug = null; }
                liveState.rafId = requestAnimationFrame(liveLoop);
            } catch (err) {
                alert('Camera error: ' + err.message);
                switchToMode('image');
            }
        }

        function stopCamera() {
            if (liveState.rafId) { cancelAnimationFrame(liveState.rafId); liveState.rafId = null; }
            if (liveState.stream) { liveState.stream.getTracks().forEach(t => t.stop()); liveState.stream = null; }
            liveVideo.srcObject = null;
        }

        function switchToMode(mode) {
            const prevMode = state.mode;
            const isSwitch = prevMode !== mode;
            if (state.mode === 'live') {
                stopCamera();
                if (mode !== 'live') {
                    document.body.classList.remove('live-fullscreen');
                    gridCanvas.style.position = '';
                    gridCanvas.style.left = '';
                    gridCanvas.style.top = '';
                    gridCanvas.style.width = '';
                    gridCanvas.style.height = '';
                }
            }
            // Reset grid whenever switching between modes
            if (isSwitch) {
                state.hideGrid = false;
                // Leaving Image: clear loaded image so Image starts fresh next time unless user uploads again
                if (prevMode === 'image') {
                    state.srcImage = null;
                    const fn = document.getElementById('file-name');
                    if (fn) fn.textContent = '';
                    const fi = document.getElementById('file-input');
                    if (fi) fi.value = '';
                }
                resetCells();
            }

            // Live: remove gap between pixels (restore on exit)
            if (prevMode === 'live' && mode !== 'live') {
                if (state.gapBeforeLive !== null) {
                    state.gap = state.gapBeforeLive;
                    state.gapBeforeLive = null;
                }
            }
            if (mode === 'live') {
                if (state.gapBeforeLive === null) state.gapBeforeLive = state.gap;
                state.gap = 0;
            }
            state.mode = mode;
            document.querySelectorAll('.fm-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.mob-fm-btn').forEach(b => b.classList.remove('active'));
            var liveOpts = document.getElementById('live-options');
            if (liveOpts) liveOpts.style.display = 'none';
            // Upload zone overlays the canvas, shown only in Upload mode with no photo loaded yet
            updateUploadZoneVisibility();
            if (mode === 'image') {
                state.hideGrid = false;
                var fmImg = document.getElementById('fm-image'); if (fmImg) fmImg.classList.add('active');
                var mobFmImg = document.getElementById('mob-fm-image'); if (mobFmImg) mobFmImg.classList.add('active');
                gridCanvas.style.cursor = 'default';
                // Upload mode: always use palette-mapped image colors; avoid aggressive background cut.
                state.useImageColors = true;
                state.imgBgCut = 255;
                if (state.srcImage) applyImage(); else renderGrid();
            } else if (mode === 'live') {
                var fmLive = document.getElementById('fm-live'); if (fmLive) fmLive.classList.add('active');
                var mobFmLive = document.getElementById('mob-fm-live'); if (mobFmLive) mobFmLive.classList.add('active');
                if (liveOpts) liveOpts.style.display = '';
                gridCanvas.style.cursor = 'default';
                state.hideGrid = false;
                window.__liveLayoutMode = getLayoutMode();
                startCamera();
            }
            if (typeof updateMobileButtonsForMode === 'function') updateMobileButtonsForMode();
        }

        // Live colors are derived from the selected palette preset

        // ═══════════════════════════════════════════════════
        //  MOBILE: Panel toggle
        // ═══════════════════════════════════════════════════
        const panelToggleBar = document.getElementById('panel-toggle-bar');
        const panel = document.getElementById('panel');
        const mobShutter = document.getElementById('mob-shutter');
        const mobFlip = document.getElementById('mob-flip');
        const mobDl = document.getElementById('mob-download');
        const mobRatio = document.getElementById('mob-ratio');
        const mobZoom = document.getElementById('mob-zoom');
        const mobZoomPop = document.getElementById('mob-zoom-pop');

        // Mobile FAB visibility by mode:
        // - Live: show shutter + flip + ratio + download
        // - Upload: show download only
        function updateMobileButtonsForMode() {
            const isSmall = isMobileLayout();
            var modeBtn = document.getElementById('mob-capture-mode');
            if (!isSmall) {
                mobShutter.style.display = 'none';
                mobFlip.style.display = 'none';
                mobDl.style.display = 'none';
                if (mobZoom) mobZoom.style.display = 'none';
                if (mobZoomPop) mobZoomPop.style.display = 'none';
                if (mobRatio) mobRatio.style.display = 'none';
                if (modeBtn) modeBtn.style.display = 'none';
                return;
            }

            const panelOpen = panel.classList.contains('panel-open');
            if (panelOpen) {
                mobShutter.style.display = 'none';
                mobFlip.style.display = 'none';
                // Keep Download available in Upload even when panel is open.
                // In Live we download via the preview modal (from shutter/record stop), so keep it hidden.
                mobDl.style.display = (state.mode === 'live') ? 'none' : 'block';
                if (mobZoom) mobZoom.style.display = (state.mode === 'live') ? 'flex' : 'none';
                if (mobRatio) mobRatio.style.display = 'none';
                if (modeBtn) modeBtn.style.display = 'none';
                return;
            }

            // Mobile download FAB:
            // - In Live we download via the preview modal, so hide this button.
            // - In Upload keep it available.
            mobDl.style.display = (state.mode === 'live') ? 'none' : 'block';
            if (mobZoom) mobZoom.style.display = (state.mode === 'live') ? 'flex' : 'none';
            if (mobZoomPop && state.mode !== 'live') mobZoomPop.style.display = 'none';

            if (state.mode === 'live') {
                mobShutter.style.display = 'block';
                mobFlip.style.display = 'flex';
                // Ratio button disabled on mobile: Live fits device automatically
                if (mobRatio) mobRatio.style.display = 'none';
                if (modeBtn) {
                    modeBtn.style.display = 'flex';
                    modeBtn.textContent = state.captureMode === 'video' ? 'video' : 'image';
                }
            } else {
                mobShutter.style.display = 'none';
                mobFlip.style.display = 'none';
                if (mobRatio) mobRatio.style.display = 'none';
                if (modeBtn) modeBtn.style.display = 'none';
            }
        }

        function toggleMobilePanel() {
            panel.classList.toggle('panel-open');
            var isOpen = panel.classList.contains('panel-open');
            panelToggleBar.classList.toggle('active', isOpen);
            document.body.classList.toggle('panel-open', isOpen);
            updateMobileButtonsForMode();
            // Update CSS var with actual panel height to avoid whitespace gaps
            requestAnimationFrame(() => {
                const h = isOpen ? Math.round(panel.getBoundingClientRect().height) : 0;
                document.documentElement.style.setProperty('--panel-open-h', h + 'px');
                renderGrid();
            });
            // Panel opens with a transition; resync after it settles so canvas always moves up.
            if (isOpen) {
                setTimeout(() => {
                    syncPanelOpenHeightVar();
                    renderGrid();
                }, 380);
            }
        }

        function syncPanelOpenHeightVar() {
            try {
                if (!panel) return;
                const isOpen = panel.classList.contains('panel-open') || document.body.classList.contains('panel-open');
                const h = isOpen ? Math.round(panel.getBoundingClientRect().height) : 0;
                document.documentElement.style.setProperty('--panel-open-h', h + 'px');
            } catch (_) { }
        }

        if (panelToggleBar) panelToggleBar.addEventListener('click', () => {
            toggleMobilePanel();
        });
        // Ensure initial layout uses correct panel height (if panel starts open)
        syncPanelOpenHeightVar();
        try { window.__layoutMode = getLayoutMode(); } catch (_) { }

        // ═══════════════════════════════════════════════════
        //  MOBILE: Camera buttons
        // ═══════════════════════════════════════════════════

        // Camera flip
        function flipCamera() {
            if (state.mode !== 'live') return;
            liveState.userSetFacing = true;
            liveState.facingMode = liveState.facingMode === 'user' ? 'environment' : 'user';
            liveState.mirror = (liveState.facingMode === 'user');
            stopCamera();
            startCamera();
        }
        if (mobFlip) mobFlip.addEventListener('click', flipCamera);
        var flipCamBtn = document.getElementById('l-flip-cam');
        if (flipCamBtn) flipCamBtn.addEventListener('click', flipCamera);

        function cycleAspectRatio() {
            const orderMobile = ['9:16', '4:5', '3:4', '1:1'];
            const orderDesktop = ['16:9', '4:5', '3:4', '1:1'];
            const order = isMobileLayout() ? orderMobile : orderDesktop;

            const idx = order.indexOf(liveState.aspectRatio);
            liveState.aspectRatio = order[(idx >= 0 ? idx + 1 : 0) % order.length];
            // Never allow landscape option on mobile
            if (isMobileLayout() && liveState.aspectRatio === '16:9') liveState.aspectRatio = '9:16';
            liveCoverCanvas = null;
            liveCoverLastRatio = null;
            if (mobRatio) {
                mobRatio.setAttribute('aria-label', 'Aspect ratio ' + liveState.aspectRatio);
                mobRatio.title = liveState.aspectRatio;
            }
            // Force immediate refresh (helps when CSS/layout caches)
            if (state.mode === 'live') renderGrid();
        }
        if (mobRatio) mobRatio.addEventListener('click', cycleAspectRatio);

        var mobCaptureModeBtn = document.getElementById('mob-capture-mode');
        function setCaptureMode(mode) {
            state.captureMode = (mode === 'video') ? 'video' : 'image';
            if (mobCaptureModeBtn) mobCaptureModeBtn.textContent = state.captureMode;
        }
        if (mobCaptureModeBtn) mobCaptureModeBtn.addEventListener('click', function () {
            setCaptureMode(state.captureMode === 'image' ? 'video' : 'image');
        });

        // Swipe left/right on the viewfinder to switch Photo <-> Video, like a phone camera's mode row.
        (function () {
            let sx = 0, sy = 0, tracking = false;
            const SWIPE_MIN = 40;
            gridCanvas.addEventListener('touchstart', (e) => {
                if (state.mode !== 'live' || !e.touches || e.touches.length !== 1) { tracking = false; return; }
                tracking = true;
                sx = e.touches[0].clientX; sy = e.touches[0].clientY;
            }, { passive: true });
            gridCanvas.addEventListener('touchend', (e) => {
                if (!tracking) return;
                tracking = false;
                if (state.mode !== 'live') return;
                const t = e.changedTouches && e.changedTouches[0];
                if (!t) return;
                const dx = t.clientX - sx, dy = t.clientY - sy;
                if (Math.abs(dx) > SWIPE_MIN && Math.abs(dx) > Math.abs(dy) * 1.5) {
                    setCaptureMode(state.captureMode === 'image' ? 'video' : 'image');
                }
            }, { passive: true });
        })();

        var liveVideoRecorder = null;
        var recordedChunks = [];
        var liveRecordCanvas = null;
        var liveRecordCtx = null;
        var liveRecordInterval = null;
        var LIVE_RECORD_FPS = 30;

        function stopRecordInterval() {
            if (liveRecordInterval) {
                clearInterval(liveRecordInterval);
                liveRecordInterval = null;
            }
        }

        function toggleVideoRecording() {
            if (!liveState.stream) return;
            if (liveVideoRecorder && liveVideoRecorder.state === 'recording') {
                stopRecordInterval();
                liveVideoRecorder.stop();
                mobShutter.classList.remove('recording');
                liveRecordCanvas = null;
                liveRecordCtx = null;
                return;
            }
            recordedChunks = [];
            var recordRatio = liveState.aspectRatio;
            var dim = getLiveCoverDimensions(recordRatio);
            liveRecordCanvas = document.createElement('canvas');
            liveRecordCanvas.width = dim.w;
            liveRecordCanvas.height = dim.h;
            liveRecordCtx = liveRecordCanvas.getContext('2d');
            // Seed real content before the stream/recorder start, so the first
            // captured frame isn't a blank black canvas.
            drawGridToContext(liveRecordCtx, liveRecordCanvas.width, liveRecordCanvas.height);
            var mime = 'video/webm';
            if (MediaRecorder.isTypeSupported('video/mp4')) mime = 'video/mp4';
            else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) mime = 'video/webm;codecs=vp9';
            var canvasStream = liveRecordCanvas.captureStream(LIVE_RECORD_FPS);
            var audioTracks = (liveState.stream && liveState.stream.getAudioTracks) ? liveState.stream.getAudioTracks() : [];
            var stream = audioTracks.length
                ? new MediaStream([].concat(canvasStream.getVideoTracks(), audioTracks))
                : canvasStream;
            try {
                liveVideoRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 5000000 });
            } catch (e) {
                liveVideoRecorder = new MediaRecorder(stream);
            }
            liveVideoRecorder.ondataavailable = function (e) { if (e.data.size) recordedChunks.push(e.data); };
            liveVideoRecorder.onstop = function () {
                stopRecordInterval();
                mobShutter.classList.remove('recording');
                liveRecordCanvas = null;
                liveRecordCtx = null;
                if (recordedChunks.length === 0) return;
                var rec = liveVideoRecorder;
                var mimeType = rec.mimeType || 'video/webm';
                var ext = mimeType.indexOf('mp4') !== -1 ? 'mp4' : 'webm';
                var blob = new Blob(recordedChunks, { type: mimeType });
                var fileName = 'pixelmaker_' + Date.now() + '.' + ext;
                openVideoExportPreview(blob, fileName, mimeType);
                liveVideoRecorder = null;
            };
            liveVideoRecorder.start(1000 / LIVE_RECORD_FPS);
            liveRecordInterval = setInterval(function () {
                if (liveRecordCanvas && liveRecordCtx && liveVideoRecorder && liveVideoRecorder.state === 'recording') {
                    drawGridToContext(liveRecordCtx, liveRecordCanvas.width, liveRecordCanvas.height);
                }
            }, 1000 / LIVE_RECORD_FPS);
            mobShutter.classList.add('recording');
        }

        // Shutter: in live mode → snapshot (image) or start/stop video; only visible in Live
        if (mobShutter) mobShutter.addEventListener('click', () => {
            if (state.mode === 'live') {
                if (state.captureMode === 'video') {
                    toggleVideoRecording();
                } else {
                    // Live export uses what's on screen (liveCoverCanvas)
                    state.exportRatio = null;
                    var cnv;
                    if (liveCoverCanvas && liveCoverCanvas.width > 0 && liveCoverCanvas.height > 0) {
                        cnv = document.createElement('canvas');
                        cnv.width = liveCoverCanvas.width;
                        cnv.height = liveCoverCanvas.height;
                        cnv.getContext('2d').drawImage(liveCoverCanvas, 0, 0);
                    } else {
                        var dim = LIVE_EXPORT_DIMENSIONS[state.exportRatio] || LIVE_EXPORT_DIMENSIONS['9:16'];
                        cnv = document.createElement('canvas');
                        cnv.width = dim.w;
                        cnv.height = dim.h;
                        var ctx = cnv.getContext('2d');
                        ctx.fillStyle = state.bg;
                        ctx.fillRect(0, 0, dim.w, dim.h);
                        drawGridToContext(ctx, dim.w, dim.h);
                    }
                    openExportPreview(cnv, 'pixel_art_maker_capture_' + Date.now() + '.png');
                    // Stay in Live after capture (don't stop camera / don't switch modes)
                }
            }
        });

        // Download: always downloads the pixel fill image
        if (mobDl) mobDl.addEventListener('click', downloadPixels);


        // ═══════════════════════════════════════════════════
        //  INIT
        // ═══════════════════════════════════════════════════
        switchToMode('live');
        if (typeof updateMobileButtonsForMode === 'function') updateMobileButtonsForMode();

        function syncPresetButtons() {
            const el = document.getElementById('palette-presets');
            if (!el) return;
            el.querySelectorAll('[data-preset]').forEach(b => {
                b.classList.toggle('active', b.getAttribute('data-preset') === ACTIVE_PALETTE_KEY);
            });
        }

        function bindPresetBar(id) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('click', (e) => {
                // robust: avoid relying on Element.closest
                let btn = e.target;
                while (btn && btn !== el) {
                    if (btn.dataset && btn.dataset.preset) break;
                    btn = btn.parentElement;
                }
                if (!btn || btn === el || !btn.dataset || !btn.dataset.preset) btn = null;
                if (!btn) return;
                const key = btn.dataset.preset;
                setActivePalettePreset(key);
                // choose default cell color = palette dark
                state.fillCol = getPaletteDarkLight().dark;
                if (state.mode === 'image' && state.srcImage) applyImage(); else renderGrid();
                syncPresetButtons();
            });
        }

        // Palette presets: the built-in ones render immediately; palette_list/manifest.json
        // (generated by palette_list/build_manifest.py from whatever PNGs are in that folder)
        // is fetched after and merged in — so that folder is the single source of truth for
        // which extra palettes show up, with no code changes needed to add or remove one.
        renderPresetBar();
        bindPresetBar('palette-presets');
        syncPresetButtons();

        async function loadFolderPalettes() {
            try {
                const res = await fetch('palette_list/manifest.json', { cache: 'no-store' });
                if (!res.ok) return;
                const entries = await res.json();
                if (!Array.isArray(entries)) return;
                entries.forEach((e) => {
                    if (!e || !e.key || !Array.isArray(e.colors) || e.colors.length < 2) return;
                    PALETTE_PRESETS[e.key] = e.colors;
                    PALETTE_LABELS[e.key] = e.label || e.key;
                });
                renderPresetBar();
                syncPresetButtons();
            } catch (_) {
                // Offline, blocked fetch, or opened via file:// — keep just the built-in palettes.
            }
        }
        loadFolderPalettes();

        // PWA: register service worker for installability + reliable updates
        (function () {
            if (!('serviceWorker' in navigator)) return;
            const __BUILD = 'v44';
            try {
                const bt = document.getElementById('build-tag');
                if (bt) bt.textContent = __BUILD;
            } catch (_) { }

            function hasQueryFlag(name) {
                try { return new URLSearchParams(location.search).has(name); } catch (_) { return false; }
            }

            async function resetServiceWorkerAndReload() {
                try {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(regs.map(r => r.unregister()));
                } catch (_) { }
                try {
                    if ('caches' in window) {
                        const keys = await caches.keys();
                        await Promise.all(keys.map(k => caches.delete(k)));
                    }
                } catch (_) { }
                location.replace(location.pathname + '?v=' + Date.now());
            }

            // Escape hatch: open `...?__sw_reset=1` on iPhone to force a clean load
            if (hasQueryFlag('__sw_reset')) {
                resetServiceWorkerAndReload();
                return;
            }

            // Expose for debugging from Safari (DevTools): `forceAppUpdate()`
            window.forceAppUpdate = resetServiceWorkerAndReload;

            // Versioned SW URL forces Safari to re-fetch updated sw.js
            const __SW_URL = 'sw.js?v=45';
            navigator.serviceWorker.register(__SW_URL).then((reg) => {
                function trySkipWaiting() {
                    if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                }
                try { reg.update(); } catch (_) { }
                reg.addEventListener('updatefound', () => {
                    const nw = reg.installing;
                    if (!nw) return;
                    nw.addEventListener('statechange', () => {
                        if (nw.state === 'installed') trySkipWaiting();
                    });
                });

                // If there's already an update waiting, activate it
                trySkipWaiting();
            }).catch(() => { });

            // When the new SW takes control, reload once so the UI uses the new cached files
            let reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (reloading) return;
                reloading = true;
                location.reload();
            });
        })();

        // Add to home screen prompt — shown on mobile when opening from link (not when already launched from icon)
        (function () {
            const installEl = document.getElementById('install-prompt');
            const installBtn = document.getElementById('install-prompt-btn');
            const skipBtn = document.getElementById('install-prompt-skip');
            const manualHint = document.getElementById('install-manual-hint');
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                window.navigator.standalone === true;
            const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth <= 700;
            let deferredPrompt = null;

            window.addEventListener('beforeinstallprompt', function (e) {
                e.preventDefault();
                deferredPrompt = e;
            });

            function showManualHint() {
                if (!manualHint) return;
                if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                    manualHint.textContent = 'In Safari: tap Share (□↑), then "Add to Home Screen", then Add.';
                } else {
                    manualHint.textContent = 'Use your browser menu: ⋮ → "Add to Home screen" or "Install app".';
                }
                manualHint.style.display = 'block';
            }

            function showInstallSteps() {
                if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                    alert('To add Pixelart Maker to your home screen:\n\n1. Tap the Share button (□ with arrow) at the bottom of Safari.\n2. Scroll down and tap "Add to Home Screen".\n3. Tap "Add".');
                } else {
                    showManualHint();
                }
            }

            if (installBtn) installBtn.addEventListener('click', function () {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then(function (r) {
                        if (r.outcome === 'accepted') installEl.classList.remove('show');
                        deferredPrompt = null;
                    });
                } else {
                    showInstallSteps();
                }
            });
            if (skipBtn) skipBtn.addEventListener('click', function () {
                installEl.classList.remove('show');
                try { sessionStorage.setItem('pixelmaker-skip-install', '1'); } catch (_) { }
            });

            if (installEl && isMobile && !isStandalone) {
                try {
                    if (sessionStorage.getItem('pixelmaker-skip-install')) return;
                } catch (_) { }
                installEl.setAttribute('aria-hidden', 'false');
                installEl.classList.add('show');
                if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) showManualHint();
            }
        })();
    </script>
</body>

</html>
