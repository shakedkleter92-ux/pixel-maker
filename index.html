<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Phone-only format: on a wide (desktop/tablet) top-level window, redirect to frame.html,
         which re-embeds this same page inside a fixed phone-shaped iframe so the app always
         renders as if on a phone. Real phones (already narrow) and the embedded instance
         itself (?pmFrame=1) skip this and render normally. -->
    <script>
        (function () {
            try {
                if (window.self !== window.top) return;
                var qp = new URLSearchParams(location.search);
                if (qp.has('pmFrame')) return;
                if (window.innerWidth <= 700) return;
                location.replace('frame.html' + location.search + location.hash);
            } catch (e) { }
        })();
    </script>
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pixelart Maker" />
    <title>Pixelart Maker</title>
    <!-- Social / share preview -->
    <meta property="og:title" content="Pixelart Maker" />
    <meta property="og:description" content="make it pixel" />
    <meta property="og:image" content="https://shakedkleter92-ux.github.io/pixelmakegrid/icon.svg" />
    <meta property="og:url" content="https://shakedkleter92-ux.github.io/pixelmakegrid/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pixelart Maker" />
    <meta name="twitter:description" content="make it pixel" />
    <meta name="twitter:image" content="https://shakedkleter92-ux.github.io/pixelmakegrid/icon.svg" />
    <link rel="manifest" href="manifest.json" />
    <!-- אייקון למסך הבית — משתמש באייקון מהתיקייה -->
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #fff;
            --panel: #f0f0f0;
            --surface: #e4e4e4;
            --border: #000;
            --text: #000;
            --muted: #666;
            /* Floating controls over the canvas (camera buttons, mode header, toggle bar):
               slightly see-through so what's behind them stays visible. */
            --fab-bg: rgba(255, 255, 255, 0.82);
            /* The one deliberate spot of color in an otherwise monochrome UI: the current
               position on the zoom dial, so it reads instantly like a camera app's zoom. */
            --zoom-accent: #f5a623
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'IBM Plex Mono', monospace;
            background: var(--bg);
            color: var(--text)
        }

        #app {
            display: flex;
            height: 100vh;
            width: 100vw
        }

        /* Panel */
        #panel {
            width: 270px;
            min-width: 250px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent
        }

        /* Desktop-only section (mode switch lives in panel only on desktop) */
        .desktop-mode-switch {
            display: block;
        }

        @media (max-width: 1024px) {
            .desktop-mode-switch {
                display: none !important;
            }
        }

        #panel-header {
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--border)
        }

        #panel-header h1 {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase
        }

        #panel-header p {
            font-size: 9px;
            color: var(--muted);
            margin-top: 3px;
            letter-spacing: .05em
        }

        /* Desktop: show panel header (app title) */
        @media (min-width: 1025px) {
            #panel-header {
                display: block;
            }
        }
        /* Mobile/tablet: keep header hidden */
        @media (max-width: 1024px) {
            #panel-header {
                display: none;
            }
        }

        /* Desktop: keep panel visible in all modes */

        .section {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border)
        }

        .section:last-child {
            border-bottom: none
        }

        .sec-label {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px
        }

        /* A sec-label sharing a slider's row (e.g. Resolution) acts as that slider's
           label instead of a stacked heading — no bottom margin, no shrinking/wrapping. */
        .slider-row>.sec-label {
            margin-bottom: 0;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .sec-num {
            font-size: 8px;
            color: var(--text);
            opacity: .35
        }

        /* Sliders */
        .slider-row {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 10px;
            margin-bottom: 7px
        }

        /* Keep stacked sliders tight, but add space after button groups */
        .slider-row+.slider-row {
            margin-top: 0;
        }

        .slider-row:last-child {
            margin-bottom: 0
        }

        .sl-label {
            font-size: 9px;
            color: var(--muted);
            min-width: 58px
        }

        .sl-val {
            font-size: 9px;
            font-weight: 600;
            min-width: 32px;
            text-align: right
        }

        input[type=range] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 1px;
            background: var(--border);
            outline: none;
            cursor: pointer
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 0;
            background: var(--text);
            cursor: pointer
        }

        /* Color rows */
        .color-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 7px
        }

        .color-row:last-child {
            margin-bottom: 0
        }

        .color-row label {
            font-size: 9px;
            color: var(--muted);
            flex: 1
        }

        .palette-target {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }

        .palette-presets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }

        /* Fixed grid = every preset button is the same size no matter its label's length
           or how many presets there are; long labels are clipped with an ellipsis instead
           of stretching their button. */
        .pal-tgt {
            padding: 6px 2px;
            border: 1px solid var(--border);
            background: var(--bg);
            font-size: 8px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            text-align: center;
            cursor: pointer;
            color: var(--muted);
            transition: background .12s, color .12s, transform .12s;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (hover:hover) {
            .pal-tgt:hover {
                background: var(--surface);
                color: var(--text);
            }
        }

        .pal-tgt.active {
            background: var(--text);
            color: var(--bg);
        }

        input[type=color] {
            width: 30px;
            height: 22px;
            border: 1px solid var(--border);
            border-radius: 0;
            background: none;
            padding: 1px;
            cursor: pointer
        }

        /* Fill mode switch */
        #fill-mode {
            display: flex;
            margin-bottom: 10px
        }

        .fm-btn {
            flex: 1;
            padding: 8px 6px;
            border: 1px solid var(--border);
            border-radius: 0;
            background: var(--bg);
            font-size: 9px;
            font-weight: 600;
            letter-spacing: .09em;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'IBM Plex Mono', monospace;
            color: var(--muted);
            transition: background .12s, color .12s, transform .12s
        }

        .fm-btn:first-child {
            border-right: none
        }

        .fm-btn.active {
            background: var(--text);
            color: var(--bg)
        }

        /* Upload drop zone: overlays the canvas in #main (Image mode, no photo yet) */
        #upload-zone {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
        }

        #drop-zone {
            width: 100%;
            max-width: 320px;
            border: 2px dashed var(--border);
            border-radius: 0;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: background .15s;
        }

        #drop-zone:hover,
        #drop-zone.drag-over {
            background: var(--surface)
        }

        .dz-input {
            position: absolute;
            inset: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer
        }

        .dz-text {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6
        }

        #file-name {
            margin-top: 6px;
            font-size: 11px;
            font-weight: 600;
            word-break: break-all
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 0;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'IBM Plex Mono', monospace;
            transition: background .12s, color .12s, transform .12s;
            margin-bottom: 5px
        }

        /* Unified button interactions (like top dock): subtle scale on hover/press */
        button,
        .btn,
        .fm-btn,
        .mob-fm-btn,
        .pal-tgt,
        #panel-toggle-bar,
        #mob-shutter,
        #mob-flip,
        #mob-capture-mode,
        #mob-download,
        #mob-ratio,
        #mob-zoom {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* iOS sometimes tints button text blue — force monochrome UI */
        button {
            /* Keep author-defined color, just prevent iOS blue tint */
            -webkit-text-fill-color: currentColor;
        }

        /* Active buttons must invert text color (iOS needs explicit override) */
        .pal-tgt.active,
        .fm-btn.active {
            color: var(--bg) !important;
            -webkit-text-fill-color: var(--bg) !important;
        }

        .btn:active,
        .fm-btn:active,
        .mob-fm-btn:active,
        .pal-tgt:active,
        #panel-toggle-bar:active,
        #mob-shutter:active,
        #mob-flip:active,
        #mob-capture-mode:active,
        #mob-download:active,
        #mob-ratio:active,
        #mob-zoom:active {
            transform: scale(.97);
        }

        @media (hover:hover) {

            .btn:hover,
            .fm-btn:hover,
            .mob-fm-btn:hover,
            .pal-tgt:hover,
            #panel-toggle-bar:hover,
            #mob-shutter:hover,
            #mob-flip:hover,
            #mob-capture-mode:hover,
            #mob-download:hover,
            #mob-ratio:hover,
            #mob-zoom:hover {
                transform: scale(1.02);
                background: var(--surface);
            }
        }

        .btn:last-child {
            margin-bottom: 0
        }

        /* Only show inside panel on desktop; mobile uses floating undo */
        .desktop-only {
            display: block;
        }

        @media (max-width: 700px) {
            .desktop-only {
                display: none !important;
            }
        }

        /* ───── Tablet layout (drawer like mobile) ───── */
        @media (min-width: 701px) and (max-width: 1024px) {

            html,
            body {
                overflow: hidden;
                height: 100%
            }

            /* show top mode header on tablet too */
            #mob-mode-header {
                display: flex;
            }

            #app {
                flex-direction: column;
                height: 100dvh;
                overflow: hidden;
                padding-top: 0;
                box-sizing: border-box;
            }

            /* Canvas area fills the top (above bottom bar) */
            #main {
                position: fixed;
                /* Keep canvas flush under the fixed top header (no jump on panel open) */
                top: 48px;
                left: 0;
                right: 0;
                bottom: 68px;
                z-index: 0;
                height: auto;
                min-height: 0;
            }

            #grid-canvas {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }

            /* Panel becomes a sliding drawer from the bottom */
            #panel {
                position: fixed;
                bottom: 68px;
                left: 0;
                right: 0;
                width: 100%;
                min-width: unset;
                max-height: 0;
                overflow: hidden;
                border-right: none;
                border-top: 1px solid var(--border);
                z-index: 90;
                transition: max-height .35s cubic-bezier(.4, 0, .2, 1)
            }

            #panel.panel-open {
                max-height: 40vh;
                overflow-y: auto;
                /* Always sit above every floating control (mode header, shutter, zoom, etc.) */
                z-index: 200;
                background: rgba(255, 255, 255, 0.3);
                -webkit-backdrop-filter: blur(14px) saturate(140%);
                backdrop-filter: blur(14px) saturate(140%);
                isolation: isolate;
                color: var(--text);
            }

            #panel.panel-open .section {
                background: rgba(255, 255, 255, 0.18);
            }

            /* Canvas stays full-size and fixed; the panel is a translucent overlay
               that slides up over it, not a layout that pushes/shrinks it. */

            /* Show toggle bar */
            #panel-toggle-bar {
                display: flex
            }

            /* Hide desktop-only controls */
            .desktop-only {
                display: none !important;
            }
        }

        .btn-fill {
            background: var(--text);
            color: var(--bg)
        }

        .btn-fill:hover {
            background: var(--muted)
        }

        .btn-fill:disabled {
            opacity: .35;
            cursor: not-allowed
        }

        .btn-outline {
            background: var(--bg);
            color: var(--muted)
        }

        .btn-outline:hover {
            background: var(--surface);
            color: var(--text)
        }

        /* Canvas area */
        #main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            position: relative;
            overflow: hidden
        }

        #main::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: linear-gradient(45deg, #e8e8e8 25%, transparent 25%), linear-gradient(-45deg, #e8e8e8 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e8e8e8 75%), linear-gradient(-45deg, transparent 75%, #e8e8e8 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0
        }

        #grid-canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1
        }

        /* Live: canvas full viewport – 9:16 fills screen, header/bar stay on top */
        body.live-fullscreen #grid-canvas {
            position: fixed !important;
            left: 0 !important;
            top: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            z-index: 1;
        }

        /* ───── Mobile top header (mode: Upload / Live) ───── */
        #mob-mode-header {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 48px;
            z-index: 120;
            background: var(--fab-bg);
            border: 1px solid var(--border);
            flex-direction: row;
            align-items: stretch;
        }

        #mob-mode-header .mob-fm-btn {
            flex: 1;
            border: none;
            border-right: 1px solid var(--border);
            border-radius: 0;
            background: var(--fab-bg);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'IBM Plex Mono', monospace;
            color: var(--muted);
            transition: background .12s, color .12s, transform .12s;
        }

        #mob-mode-header .mob-fm-btn>span {
            display: inline-block;
            transition: transform .12s ease;
            transform: translateZ(0);
        }

        /* Hover: grey background + scale text only */
        @media (hover:hover) {
            #mob-mode-header .mob-fm-btn:hover {
                background: var(--surface);
                transform: none;
                /* override global hover scale */
            }

            #mob-mode-header .mob-fm-btn:hover>span {
                transform: scale(1.08);
            }
        }

        /* Press: scale text only */
        #mob-mode-header .mob-fm-btn:active {
            transform: none;
            /* override global active scale */
        }

        #mob-mode-header .mob-fm-btn:active>span {
            transform: scale(.97);
        }

        #mob-mode-header .mob-fm-btn:last-child {
            border-right: none;
        }

        #mob-mode-header .mob-fm-btn.active {
            background: var(--text);
            color: var(--bg);
            -webkit-text-fill-color: var(--bg);
        }

        #mob-mode-header .mob-fm-btn.active>span {
            color: var(--bg);
            -webkit-text-fill-color: var(--bg);
        }

        /* ───── Mobile bottom bar & panel toggle ───── */
        #panel-toggle-bar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 68px;
            background: var(--fab-bg);
            border-top: 1px solid var(--border);
            border-radius: 0;
            z-index: 110;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            font-family: 'IBM Plex Mono', monospace;
            color: var(--muted);
            transition: background .1s;
        }

        #panel-toggle-bar.active {
            background: var(--text);
            color: var(--bg);
        }

        #panel-toggle-bar.active span,
        #panel-toggle-bar.active button {
            color: var(--bg);
        }

        #panel-toggle-bar span {
            flex: 1;
            text-align: center;
        }

        #panel-toggle-btn {
            display: none
        }

        /* Export preview modal */
        #export-modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 200;
            background: rgba(0, 0, 0, 0.35);
            -webkit-backdrop-filter: blur(10px) saturate(120%);
            backdrop-filter: blur(10px) saturate(120%);
        }

        #export-modal.open {
            display: flex;
        }

        .export-modal-card {
            width: min(920px, 100%);
            max-height: min(88vh, 900px);
            background: rgba(255, 255, 255, 0.72);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            backdrop-filter: blur(14px) saturate(140%);
            border: 1px solid var(--border);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
        }

        /* top bar removed */
        .export-modal-top {
            display: none;
        }

        .export-modal-title {
            display: none;
        }

        .export-modal-body {
            padding: 14px;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.25);
        }

        #export-preview-canvas {
            max-width: 100%;
            max-height: 70vh;
            width: auto;
            height: auto;
            image-rendering: pixelated;
            border: 1px solid rgba(0, 0, 0, 0.12);
            background: #fff;
        }

        #export-preview-video {
            max-width: 100%;
            max-height: 70vh;
            width: 100%;
            height: auto;
            border: 1px solid rgba(0, 0, 0, 0.12);
            background: #000;
        }

        .export-modal-actions {
            padding: 12px 14px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Action buttons: small, side-by-side, stay inside card */
        .export-modal-actions .btn {
            padding: 10px 12px;
            font-size: 10px;
            letter-spacing: .12em;
            text-transform: uppercase;
            min-width: 120px;
        }

        @media (max-width: 700px) {
            .export-modal-actions {
                justify-content: space-between;
                flex-wrap: nowrap;
            }

            .export-modal-actions .btn {
                min-width: 0;
                flex: 1;
            }
        }

        /* ───── Responsive breakpoints ───── */
        @media (max-width: 700px) {

            html,
            body {
                overflow: hidden;
                height: 100%
            }

            #mob-mode-header {
                display: flex;
            }

            #app {
                flex-direction: column;
                height: 100dvh;
                overflow: hidden;
                /* Top dock is overlay (fixed), don't reserve space */
                padding-top: 0;
                box-sizing: border-box;
            }

            /* Canvas area fills the top */
            #main {
                /* Fill all space between top and bottom bar (no white margins) */
                position: fixed;
                /* Keep canvas flush under the fixed top header (no jump on panel open) */
                top: 48px;
                left: 0;
                right: 0;
                bottom: 68px;
                z-index: 0;
                height: auto;
                min-height: 0;
            }

            #grid-canvas {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }

            /* Panel becomes a sliding drawer from the bottom */
            #panel {
                position: fixed;
                bottom: 68px;
                left: 0;
                right: 0;
                width: 100%;
                min-width: unset;
                max-height: 0;
                overflow: hidden;
                border-right: none;
                border-top: 1px solid var(--border);
                z-index: 90;
                transition: max-height .35s cubic-bezier(.4, 0, .2, 1)
            }

            #panel.panel-open {
                max-height: 40vh;
                overflow-y: auto;
                /* Always sit above every floating control (mode header, shutter, zoom, etc.) */
                z-index: 200;
                /* Frosted glass panel (readable over Live) */
                background: rgba(255, 255, 255, 0.3);
                -webkit-backdrop-filter: blur(14px) saturate(140%);
                backdrop-filter: blur(14px) saturate(140%);
                isolation: isolate;
                color: var(--text);
            }

            #panel.panel-open .sec-label,
            #panel.panel-open .sl-label,
            #panel.panel-open .sl-val,
            #panel.panel-open label,
            #panel.panel-open input:not([type="range"]),
            #panel.panel-open .sec-num {
                color: var(--text);
            }

            #panel.panel-open .mob-fm-btn:not(.active) {
                color: var(--text);
            }

            #panel.panel-open::before {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 68px;
                /* subtle dim behind the frosted panel */
                background: rgba(0, 0, 0, 0.06);
                z-index: -1;
                pointer-events: none;
            }

            #panel.panel-open>* {
                position: relative;
                z-index: 1;
            }

            #panel.panel-open .section {
                background: rgba(255, 255, 255, 0.18);
            }

            /* הקנבס נשאר קבוע במקום ובגודל שלו; הפאנל הוא overlay שקוף-למחצה
               שעולה מעליו ויורד, ולא שינוי פריסה שדוחף/מקטין אותו. */

            /* Show toggle bar */
            #panel-toggle-bar {
                display: flex
            }

            /* במובייל – בלי כפילות: Snapshot ו-Flip כבר בחוץ */
            #l-snapshot,
            #l-flip-cam {
                display: none !important;
            }

            /* Larger controls on mobile */
            .section {
                padding: 14px 16px
            }

            #panel-header {
                padding: 14px 16px 12px
            }

            #panel-header h1 {
                font-size: 14px
            }

            #panel-header p {
                font-size: 11px
            }

            .sec-label {
                font-size: 11px;
                margin-bottom: 10px
            }

            .sl-label {
                min-width: 64px;
                font-size: 11px
            }

            .sl-val {
                min-width: 36px;
                font-size: 11px
            }

            .slider-row {
                gap: 10px;
                margin-bottom: 10px
            }

            input[type=range]::-webkit-slider-thumb {
                width: 20px;
                height: 20px;
                border-radius: 0
            }

            .color-row label {
                font-size: 11px
            }

            input[type=color] {
                width: 40px;
                height: 32px
            }

            .fm-btn {
                padding: 12px 6px;
                font-size: 11px
            }

            /* במובייל: כפתורי Upload/Live רק ב-header העליון, לא בתפריט */
            .fill-mode-switcher {
                display: none
            }

            .btn {
                padding: 14px;
                font-size: 11px
            }

            .dz-text {
                font-size: 11px
            }

            /* Hide export section inside panel on mobile — FAB handles it */
            .section:has(#dl-both) {
                display: none
            }
        }

        /* Tablet / large phones: show mobile docks too (layout stays desktop) */
        @media (max-width: 1024px) {
            #mob-mode-header {
                display: flex;
            }

            #panel-toggle-bar {
                display: flex;
            }
        }

        /* ─── Floating Action Button (mobile download / camera flip) ─── */
        /* ─── Mobile Camera Buttons ─── */

        /* Base: hidden on desktop — square, same stroke as panel */
        #mob-shutter,
        #mob-flip,
        #mob-capture-mode,
        #mob-download,
        #mob-ratio {
            display: none;
            position: fixed;
            border-radius: 0;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--fab-bg);
            box-shadow: 0 3px 12px rgba(0, 0, 0, .2);
            transition: background .12s, transform .12s;
            z-index: 85
        }

        #mob-shutter:active,
        #mob-flip:active,
        #mob-capture-mode:active,
        #mob-download:active,
        #mob-ratio:active {
            transform: scale(.97)
        }

        /* Shutter — גובה 58px, מרכז תחתון */
        #mob-shutter {
            width: 58px;
            height: 58px;
            left: 50%;
            transform: translateX(-50%);
            bottom: 78px
        }

        #mob-shutter:active {
            transform: translateX(-50%) scale(.88)
        }

        @media (hover:hover) {

            /* Keep centered on hover (don't lose translateX) */
            #mob-shutter:hover {
                transform: translateX(-50%) scale(1.02);
            }
        }

        /* Inner square — smaller, centered, with clear gap from outer frame */
        #mob-shutter::before {
            content: '';
            position: absolute;
            inset: 12px;
            border-radius: 0;
            border: 1px solid var(--border)
        }

        /* Recording state — inner square filled red */
        #mob-shutter.recording::before {
            background: #ff2b2b;
            border-color: #ff2b2b
        }

        /* Flip camera — bottom-left (Live mobile) */
        #mob-flip {
            width: 44px;
            height: 44px;
            bottom: 86px;
            left: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0
        }

        #mob-flip img {
            display: block;
            object-fit: contain
        }

        /* Capture mode (image / video) — to the right of shutter, same row */
        #mob-capture-mode {
            display: none;
            position: fixed;
            width: 56px;
            height: 44px;
            bottom: 86px;
            left: calc(50% + 42px);
            transform: translateX(-50%);
            margin-left: 34px;
            border-radius: 0;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--fab-bg);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .05em;
            text-transform: uppercase;
            font-family: 'IBM Plex Mono', monospace;
            color: var(--text);
            z-index: 85;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        #mob-capture-mode:active {
            transform: translateX(-50%) scale(.95);
        }

        @media (hover:hover) {

            /* Keep centered on hover (don't lose translateX) */
            #mob-capture-mode:hover {
                transform: translateX(-50%) scale(1.02);
            }
        }

        /* Download — bottom-left (Upload; Live uses preview modal) */
        #mob-download {
            width: 44px;
            height: 44px;
            bottom: 86px;
            left: 20px;
            right: auto;
            /* Must stay above the sliding panel when it's open */
            z-index: 130
        }

        /* Download icon (arrow down) */
        #mob-download::before {
            content: '↓';
            font-size: 20px;
            line-height: 1;
            color: var(--border)
        }

        /* Live zoom FAB — bottom-right (Live only). Tapping it opens a horizontal
           drag-to-zoom wheel above it, like the zoom dial in a phone's camera app. */
        #mob-zoom {
            position: fixed;
            width: 54px;
            height: 44px;
            bottom: 86px;
            right: 20px;
            border-radius: 22px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--fab-bg);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .02em;
            font-family: 'IBM Plex Mono', monospace;
            color: var(--text);
            -webkit-text-fill-color: var(--text);
            z-index: 140;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        #mob-zoom-icon {
            font-size: 13px;
            line-height: 1;
        }

        #mob-zoom-pop {
            position: fixed;
            right: 0;
            bottom: 138px;
            width: 240px;
            height: 172px;
            padding: 0;
            border: none;
            background: transparent;
            z-index: 141;
        }

        /* Curved zoom dial: a ruler bent along an arc, dragged directly (no native
           slider) — deliberately different from the app's square controls elsewhere,
           so it clearly reads as a camera-style zoom wheel. */
        #mob-zoom-dial {
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        #mob-zoom-dial-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 20px;
            font-weight: 800;
            fill: var(--zoom-accent);
        }

        /* Aspect ratio — top-right, Live only (on mobile below mode header) */
        #mob-ratio {
            width: 44px;
            height: 44px;
            top: 60px;
            right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        #mob-ratio img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        @media (max-width: 700px) {

            /* Export section still hidden in panel on mobile */
            .section:has(#dl-pixels) {
                display: none
            }
        }

        @media (min-width: 701px) and (max-width: 1024px) {

            /* Tablet — narrower panel */
            #panel {
                width: 220px;
                min-width: 200px
            }
        }

        /* מסך הזמנה להוספה למסך הבית (מובייל, בפתיחה מהקישור) */
        #install-prompt {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            font-family: 'IBM Plex Mono', monospace;
        }

        #install-prompt.show {
            display: flex;
        }

        #install-prompt h2 {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        #install-prompt p {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 20px;
            max-width: 280px;
        }

        #install-prompt .install-btn {
            padding: 14px 24px;
            border: 1px solid var(--border);
            background: var(--text);
            color: var(--bg);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'IBM Plex Mono', monospace;
            margin-bottom: 10px;
        }

        #install-prompt .skip-btn {
            background: transparent;
            color: var(--muted);
            border: none;
            font-size: 10px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <!-- Add to home screen prompt (shown on mobile when opening from link) -->
    <div id="install-prompt" aria-hidden="true">
        <h2>Pixelart Maker</h2>
        <p>Add a shortcut to your home screen to open the app from your icon.</p>
        <button type="button" class="install-btn" id="install-prompt-btn">Add to Home Screen</button>
        <p id="install-manual-hint"
            style="display:none; font-size:11px; margin-top:10px; color:var(--text); font-weight:600;"></p>
        <button type="button" class="skip-btn" id="install-prompt-skip">Continue to app</button>
    </div>
    <!-- Mobile top header: mode switch (IMAGE / LIVE) -->
    <div id="mob-mode-header" aria-label="Modes">
        <button type="button" class="mob-fm-btn" id="mob-fm-image"><span>Upload</span></button>
        <button type="button" class="mob-fm-btn active" id="mob-fm-live"><span>Live</span></button>
    </div>
    <!-- Mobile bottom bar -->
    <div id="panel-toggle-bar">
        <span>Pixelart Maker</span>
        <button id="panel-toggle-btn" aria-label="Toggle controls">☰</button>
    </div>

    <!-- Mobile camera controls -->
    <!-- Shutter: big circle at bottom center -->
    <button id="mob-shutter" aria-label="Capture"></button>
    <!-- Aspect ratio: top, Live only -->
    <button id="mob-ratio" aria-label="Aspect ratio" type="button" style="display:none">
        <img src="ratio_icon.png" alt="" width="22" height="22">
    </button>
    <!-- Camera flip: small circle -->
    <button id="mob-flip" aria-label="Flip camera" style="display:none">
        <img src="camera-switch.svg" alt="" width="22" height="22">
    </button>
    <!-- Camera rotate: cycles 0/90/180/270 -->
    <button id="mob-rotate-cam" aria-label="Rotate camera" type="button"
        style="display:none; position:fixed; width:44px; height:44px; bottom:86px; right:70px; z-index:85; border:1px solid #000; background:#fff; font-size:20px; line-height:1; cursor:pointer; border-radius:0;">↻</button>
    <!-- Download: small circle bottom-left -->
    <button id="mob-capture-mode" aria-label="Capture mode" type="button">image</button>
    <button id="mob-download" aria-label="Download"></button>
    <!-- Live Zoom: small button bottom-right (Live only) — opens a curved drag-to-zoom
         dial, like a phone camera's zoom ruler. -->
    <button id="mob-zoom" aria-label="Zoom" type="button" style="display:none">
        <span id="mob-zoom-icon" aria-hidden="true">⊙</span><span id="mob-zoom-val">1×</span>
    </button>
    <div id="mob-zoom-pop" aria-hidden="true" style="display:none">
        <svg id="mob-zoom-dial" viewBox="0 0 240 172" width="240" height="172" role="slider"
            aria-label="Zoom level" aria-valuemin="1" aria-valuemax="2" aria-valuenow="1">
            <g id="mob-zoom-ticks-g"></g>
            <text id="mob-zoom-dial-label" x="120" y="150" text-anchor="middle">1×</text>
        </svg>
    </div>

    <div id="app">
        <aside id="panel">
            <div id="panel-header">
                <h1>Pixel Art Maker</h1>
            </div>

            <!-- Mode switch (desktop): keep first in panel -->
            <div class="section desktop-mode-switch">
                <div id="fill-mode" style="display:flex">
                    <button class="fm-btn" id="fm-image" style="flex:1">Upload</button>
                    <button class="fm-btn active" id="fm-live" style="flex:1">Live</button>
                </div>
            </div>

            <!-- 01 Resolution -->
            <div class="section">
                <div class="slider-row">
                    <span class="sec-label"><span class="sec-num">01</span> Resolution</span>
                    <input type="range" id="g-res" min="8" max="300" value="250" />
                    <span class="sl-val" id="g-res-v">250</span>
                </div>
            </div>

            <!-- 02 Palette -->
            <div class="section" id="palette-section">
                <div class="sec-label"><span class="sec-num">02</span> Palette</div>
                <div class="palette-presets" id="palette-presets">
                    <button type="button" class="pal-tgt" data-preset="moldy_orange_7">Moldy</button>
                    <button type="button" class="pal-tgt" data-preset="slso8">SLSO8</button>
                    <button type="button" class="pal-tgt" data-preset="chasm">Chasm</button>
                    <button type="button" class="pal-tgt" data-preset="citrink">Citrink</button>
                    <button type="button" class="pal-tgt" data-preset="eulbink">Eulbink</button>
                    <button type="button" class="pal-tgt" data-preset="gothic_bit">Gothic</button>
                    <button type="button" class="pal-tgt active" data-preset="pollen8">Pollen8</button>
                    <button type="button" class="pal-tgt" data-preset="pspixel">PSPixel</button>
                    <button type="button" class="pal-tgt" data-preset="vanilla_milkshake">Vanilla</button>
                    <button type="button" class="pal-tgt" data-preset="p31">31</button>
                </div>
            </div>

            <!-- 03 Export -->
            <div class="section">
                <div class="sec-label"><span class="sec-num">03</span> Export</div>
                <button class="btn btn-fill" id="dl-pixels">Download</button>
                <button class="btn btn-outline" id="btn-clear">Clear All</button>
            </div>
        </aside>

        <main id="main">
            <canvas id="grid-canvas"></canvas>
            <!-- Upload (Image mode): tap/drop anywhere on the canvas to choose a photo -->
            <div id="upload-zone" style="display:none">
                <div id="drop-zone">
                    <input type="file" id="file-input" accept="image/*" class="dz-input" />
                    <div class="dz-text">Drop image here<br />or click to browse</div>
                    <div id="file-name"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Export preview modal -->
    <div id="export-modal" aria-hidden="true">
        <div class="export-modal-card" role="dialog" aria-modal="true" aria-label="Export preview">
            <div class="export-modal-body">
                <canvas id="export-preview-canvas"></canvas>
                <video id="export-preview-video" controls playsinline style="display:none"></video>
            </div>
            <div class="export-modal-actions">
                <button type="button" class="btn btn-fill" id="export-confirm">Download</button>
                <button type="button" class="btn btn-outline" id="export-close">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Surface runtime errors (helps when something stops all buttons)
        (function () {
            let shown = false;
            function show(msg) {
                if (shown) return;
                shown = true;
                try { alert(msg); } catch (_) { }
            }
            window.addEventListener('error', function (e) {
                const m = (e && e.message) ? e.message : 'Unknown error';
                show('App error: ' + m);
            });
            window.addEventListener('unhandledrejection', function (e) {
                const r = e && e.reason;
                const m = r ? (r.message || String(r)) : 'Unhandled promise rejection';
                show('App error: ' + m);
            });
        })();

        // ═══════════════════════════════════════════════════
        //  SHAPE PATH HELPER
        // ═══════════════════════════════════════════════════
        function tracePath(ctx, cx, cy, rx, ry) {
            ctx.beginPath();
            ctx.rect(cx - rx, cy - ry, rx * 2, ry * 2);
        }

        function hexToRgba(hex, a) { const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16); return `rgba(${r},${g},${b},${a})`; }

        // ═══════════════════════════════════════════════════
        //  STATE  — cells[r][c] = string color | null (empty)
        // ═══════════════════════════════════════════════════
        const state = {
            cols: 20, rows: 20, gap: 0, strokeW: 0.5,
            bg: '#ffffff', strokeCol: '#000000', fillCol: '#000000',
            cells: [],
            mode: 'live',
            // image mode
            srcImage: null, imgRes: 250, imgBg: '#ffffff', imgStrokeCol: '#000000', imgFillCol: '#000000',
            imgThreshold: 128, imgBgCut: 220, imgFillCol2: '#ffffff', imgEdge: 0,
            useImageColors: true,
            imageManualGrid: false,
            gapBeforeLive: null,
            hideGrid: false,
            captureMode: 'image',
            exportRatio: null,
        };

        function resetCells() {
            state.cells = Array.from({ length: state.rows }, () => new Array(state.cols).fill(null));
        }
        resetCells();

        // ═══════════════════════════════════════════════════
        //  GRID CANVAS
        // ═══════════════════════════════════════════════════
        const gridCanvas = document.getElementById('grid-canvas');
        const gctx = gridCanvas.getContext('2d');

        // 3 breakpoints: mobile / tablet / desktop
        const BP_MOBILE = 700;
        const BP_TABLET = 1024;
        function getLayoutMode() {
            const w = window.innerWidth || 0;
            if (w <= BP_MOBILE) return 'mobile';
            if (w <= BP_TABLET) return 'tablet';
            return 'desktop';
        }
        function isMobileLayout() { return getLayoutMode() === 'mobile'; }
        function isTabletLayout() { return getLayoutMode() === 'tablet'; }
        function isDesktopLayout() { return getLayoutMode() === 'desktop'; }

        // Live camera "preview fill" mode by breakpoint.
        // - mobile: fill screen (like camera apps) -> cover
        // - tablet: fill screen -> cover
        // - desktop: reduce perceived zoom -> contain
        function getLiveScaleMode() {
            // Camera-app behavior: mobile/tablet fill the frame (cover),
            // desktop keeps full frame visible (contain).
            if (isDesktopLayout()) return 'contain';
            return 'cover';
        }


        // Returns cell layout: {cw, ch, ox, oy} — always square cells, centered in canvas
        function cellLayout(W, H) {
            const gap = state.gap;
            const byW = (W - gap * (state.cols - 1)) / state.cols;
            const byH = (H - gap * (state.rows - 1)) / state.rows;
            // Keep full grid visible (contain) — no crop, no stretch.
            const cs = Math.max(1, Math.min(byW, byH));
            const gw = state.cols * cs + (state.cols - 1) * gap;
            const gh = state.rows * cs + (state.rows - 1) * gap;
            return { cw: cs, ch: cs, ox: (W - gw) / 2, oy: (H - gh) / 2 };
        }

        function drawGridToContext(ctx, W, H) {
            const { cw, ch, ox, oy } = cellLayout(W, H);
            const gap = state.gap;
            ctx.fillStyle = state.bg; ctx.fillRect(0, 0, W, H);
            // When Gap=0 the user expects cells to touch (no internal padding).
            // Live always uses full cells; Image uses full cells only when Gap=0.
            const pad = (state.mode === 'live' || state.gap === 0) ? 1 : 0.92;
            const rx0 = cw / 2 * pad, ry0 = ch / 2 * pad;
            for (let row = 0; row < state.rows; row++) {
                for (let col = 0; col < state.cols; col++) {
                    const cx = ox + col * (cw + gap) + cw / 2;
                    const cy = oy + row * (ch + gap) + ch / 2;
                    const cellColor = state.cells[row][col];
                    tracePath(ctx, cx, cy, rx0, ry0);
                    if (cellColor !== null) {
                        ctx.fillStyle = cellColor; ctx.fill();
                    }
                }
            }
        }

        const LIVE_COVER_BASE = 1080;
        // מקור אמת יחיד ליחס: הקנבס (liveCoverCanvas) מוגדר כאן בלבד. היצוא = העתקה של הקנבס.
        // 9:16 = פורטרט מלא (רוחב 1080, גובה 1920). אם הקנבס 9:16 – היצוא 9:16.
        var LIVE_EXPORT_DIMENSIONS = {
            '9:16': { w: 1080, h: 1920 },
            '4:5': { w: 1080, h: 1350 },
            '1:1': { w: 1080, h: 1080 },
            '3:4': { w: 1080, h: 1440 },
            '16:9': { w: 1920, h: 1080 }
        };
        let liveCoverCanvas = null;
        let liveCoverLastRatio = null;

        function renderGrid() {
            const m = document.getElementById('main');
            const isLive = state.mode === 'live';
            const compact = isMobileLayout();
            var W, H;
            if (isLive) {
                const isMobile = compact;
                if (isMobile) {
                    // Compact layout: keep canvas inside #main so it always fits above the panel
                    document.body.classList.remove('live-fullscreen');
                    gridCanvas.style.position = 'absolute';
                    gridCanvas.style.left = '0';
                    gridCanvas.style.top = '0';
                    gridCanvas.style.width = '100%';
                    gridCanvas.style.height = '100%';
                    // Always size to the actual visible canvas area (main),
                    // otherwise opening/closing the panel creates large white margins.
                    W = m.clientWidth;
                    H = m.clientHeight;
                } else {
                    // Desktop: הקנבס חי בתוך main, הפאנל נשאר גלוי בצד
                    document.body.classList.remove('live-fullscreen');
                    gridCanvas.style.position = '';
                    gridCanvas.style.left = '';
                    gridCanvas.style.top = '';
                    gridCanvas.style.width = '';
                    gridCanvas.style.height = '';
                    W = m.clientWidth;
                    H = m.clientHeight;
                }
            } else {
                document.body.classList.remove('live-fullscreen');
                gridCanvas.style.position = '';
                gridCanvas.style.left = '';
                gridCanvas.style.top = '';
                gridCanvas.style.width = '';
                gridCanvas.style.height = '';
                W = m.clientWidth;
                H = m.clientHeight;
            }

            if (isLive) {
                // Live preview: always render into the TARGET ratio frame (single source of truth),
                // then COVER-fit it into #main — fill the screen completely, cropping any excess,
                // so there's never a white margin. (Camera pixels are still "contain" inside the
                // grid itself, i.e. the full camera frame is visible with no crop there.)
                var frameW = Math.max(1, W);
                var frameH = Math.max(1, H);
                var dx = 0, dy = 0;
                var desiredAR = getLiveTargetRatioValue(); // width/height
                if (desiredAR > 1) desiredAR = 1 / desiredAR;
                var screenAR = frameW / frameH;
                if (screenAR > desiredAR) {
                    frameH = Math.max(1, Math.round(frameW / desiredAR));
                    dy = Math.round((H - frameH) / 2);
                } else {
                    frameW = Math.max(1, Math.round(frameH * desiredAR));
                    dx = Math.round((W - frameW) / 2);
                }

                var cw = frameW;
                var ch = frameH;
                var coverKey = 'screen:' + cw + 'x' + ch + ':t=' + getLiveTargetRatioKey();
                if (!liveCoverCanvas || liveCoverLastRatio !== coverKey) {
                    liveCoverCanvas = document.createElement('canvas');
                    liveCoverLastRatio = coverKey;
                }
                liveCoverCanvas.width = cw;
                liveCoverCanvas.height = ch;
                const coverCtx = liveCoverCanvas.getContext('2d');
                drawGridToContext(coverCtx, cw, ch);

                gridCanvas.width = W;
                gridCanvas.height = H;
                gctx.fillStyle = state.bg;
                gctx.fillRect(0, 0, W, H);
                gctx.imageSmoothingEnabled = false;
                gctx.drawImage(liveCoverCanvas, dx, dy, cw, ch);
                gctx.imageSmoothingEnabled = true;
                return;
            }

            gridCanvas.width = W;
            gridCanvas.height = H;
            drawGridToContext(gctx, W, H);

        function sampleImg(src, cols, rows) {
            if (!offC) { offC = document.createElement('canvas'); offX = offC.getContext('2d'); }
            offC.width = cols; offC.height = rows; offX.clearRect(0, 0, cols, rows); offX.drawImage(src, 0, 0, cols, rows);
            return offX.getImageData(0, 0, cols, rows).data;

        // ── Edge Enhance (unsharp mask convolution) ────────────────────────
        // Sharpens luminance by subtracting a fraction of neighbours.
        // Kernel (strength a): [0,-a,0, -a,1+4a,-a, 0,-a,0]
        // Returns a new Float32Array of luminance values, same length as rows*cols.
        function edgeEnhanceLum(px, cols, rows, amount) {
            const lum = new Float32Array(rows * cols);
            // First compute luminance
            for (let i = 0; i < rows * cols; i++) {
                lum[i] = 0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2];
            }
            if (amount === 0) return lum;
            const a = amount * 0.12; // scale so slider 0-10 gives gentle-to-strong
            const out = new Float32Array(rows * cols);
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const idx = r * cols + c;
                    const ctr = lum[idx];
                    const top = r > 0 ? lum[(r - 1) * cols + c] : ctr;
                    const bot = r < rows - 1 ? lum[(r + 1) * cols + c] : ctr;
                    const lft = c > 0 ? lum[r * cols + c - 1] : ctr;
                    const rht = c < cols - 1 ? lum[r * cols + c + 1] : ctr;
                    out[idx] = Math.min(255, Math.max(0, (1 + 4 * a) * ctr - a * (top + bot + lft + rht)));
                }
            }
            return out;
        }
        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(x => {
                const h = Math.max(0, Math.min(255, Math.round(x))).toString(16);

            }).join('');
        }

        function hexToRgb(hex) {
            const h = String(hex || '').trim();
            const m = /^#?([0-9a-f]{6})$/i.exec(h);
            if (!m) return { r: 0, g: 0, b: 0 };
            const v = parseInt(m[1], 16);
            return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
        }

        let ACTIVE_PALETTE_KEY = 'pollen8';
        let ACTIVE_PALETTE = PALETTE_PRESETS[ACTIVE_PALETTE_KEY].slice();
        let ACTIVE_PALETTE_RGB = ACTIVE_PALETTE.map(hexToRgb);

        function nearestPaletteColorRGB(r, g, b) {
            let best = 0;
            let bestD = Infinity;
            for (let i = 0; i < ACTIVE_PALETTE_RGB.length; i++) {
                const p = ACTIVE_PALETTE_RGB[i];
                const dr = r - p.r, dg = g - p.g, db = b - p.b;
                const d = dr * dr + dg * dg + db * db;
                if (d < bestD) { bestD = d; best = i; }
            }
            return ACTIVE_PALETTE[best];
        }

        function snapHexToBrand(hex) {
            const c = hexToRgb(hex);
            return nearestPaletteColorRGB(c.r, c.g, c.b);
        }

        function setActivePalettePreset(key) {
            if (!PALETTE_PRESETS[key]) return;
            ACTIVE_PALETTE_KEY = key;
            ACTIVE_PALETTE = PALETTE_PRESETS[key].slice();
            ACTIVE_PALETTE_RGB = ACTIVE_PALETTE.map(hexToRgb);
        }

        function paletteLuminance(hex) {
            const c = hexToRgb(hex);
            return 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;
        }

        function getPaletteDarkLight() {
            let dark = ACTIVE_PALETTE[0];
            let light = ACTIVE_PALETTE[0];
            let ld = paletteLuminance(dark);
            let ll = ld;
            for (let i = 1; i < ACTIVE_PALETTE.length; i++) {
                const h = ACTIVE_PALETTE[i];
                const l = paletteLuminance(h);
                if (l < ld) { ld = l; dark = h; }
                if (l > ll) { ll = l; light = h; }
            }
            return { dark, light };
        }

        function applyImage() {
            if (!state.srcImage) return;
            const src = state.srcImage;
            let imgCols, imgRows;
            if (state.imageManualGrid && state.cols > 1 && state.rows > 1) {
                imgCols = state.cols;
                imgRows = state.rows;
            } else {
                const N = state.imgRes;
                const aspect = src.width / src.height;
                imgCols = Math.round(N * aspect);
                imgRows = N;
            }
            state.cols = imgCols; state.rows = imgRows;
            const bgCut = state.imgBgCut;
            const px = sampleImg(src, imgCols, imgRows);
            const lum = edgeEnhanceLum(px, imgCols, imgRows, state.imgEdge);
            state.cells = Array.from({ length: imgRows }, (_, r) =>
                Array.from({ length: imgCols }, (_, c) => {
                    const i = r * imgCols + c;
                    const hasAlpha = px[i * 4 + 3] > 30;
                    const l = lum[i];
                    if (!hasAlpha) return null;
                    // Optional background cutoff (high luminance -> background)
                    if (l >= bgCut) return null;

                    const R = px[i * 4 + 0], G = px[i * 4 + 1], B = px[i * 4 + 2];
                    // Main behavior (Upload/Image): map to FULL active palette (nearest color)
                    if (state.useImageColors) return nearestPaletteColorRGB(R, G, B);

                    // Fallback: if someone disables image colors, still map to palette by luminance (2-tone)
                    const { dark: palDark, light: palLight } = getPaletteDarkLight();
                    return l < state.imgThreshold ? palDark : palLight;
                })
            );
            state.bg = state.imgBg; state.strokeCol = state.imgStrokeCol; state.fillCol = state.imgFillCol;
            renderGrid();
        }

        // ═══════════════════════════════════════════════════

        // ═══════════════════════════════════════════════════
        const EXPORT_MIN_PX = 2400;

        const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth <= 700;

        function dl(cnv, name) {
            // Desktop: prefer synchronous data URL download to avoid losing the user-gesture
            // (some browsers block async-toBlob triggered downloads from a modal button).
            if (!isMobile) {
                try {
                    const url = cnv.toDataURL('image/png');
                    const a = document.createElement('a');
                    a.download = name;
                    a.href = url;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    return;
                } catch (_) { /* fall back to toBlob */ }
            }

            cnv.toBlob(blob => {
                if (!blob) return;
                // On mobile, try Web Share API first (native share sheet)
                if (isMobile && navigator.canShare) {
                    const file = new File([blob], name, { type: 'image/png' });
                    if (navigator.canShare({ files: [file] })) {
                        navigator.share({ files: [file], title: name }).catch(() => {
                            // Share cancelled or failed — fall back to opening in new tab
                            openBlobInTab(blob);
                        });
                        return;
                    }
                }
                // Fallback: standard blob download
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.download = name;
                a.href = url;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 2000);
            }, 'image/png');
        }

        // ═══════════════════════════════════════════════════
