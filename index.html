    </div>

    <!-- Export preview modal -->
    <div id="export-modal" aria-hidden="true">
        <div class="export-modal-card" role="dialog" aria-modal="true" aria-label="Export preview">
            <div class="export-modal-body">
                <canvas id="export-preview-canvas"></canvas>
                <video id="export-preview-video" controls playsinline style="display:none"></video>
            </div>
            <div class="export-modal-actions">
                <button type="button" class="btn btn-fill" id="export-confirm">Download</button>
                <button type="button" class="btn btn-outline" id="export-close">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Surface runtime errors (helps when something stops all buttons)
        (function () {
            let shown = false;
            function show(msg) {
                if (shown) return;
                shown = true;
                try { alert(msg); } catch (_) { }
            }
            window.addEventListener('error', function (e) {
                const m = (e && e.message) ? e.message : 'Unknown error';
                show('App error: ' + m);
            });
            window.addEventListener('unhandledrejection', function (e) {
                const r = e && e.reason;
                const m = r ? (r.message || String(r)) : 'Unhandled promise rejection';
                show('App error: ' + m);
            });
        })();

        // ═══════════════════════════════════════════════════
        //  SHAPE PATH HELPER
        // ═══════════════════════════════════════════════════
        function tracePath(ctx, cx, cy, rx, ry) {
            ctx.beginPath();
            ctx.rect(cx - rx, cy - ry, rx * 2, ry * 2);
        }

        function hexToRgba(hex, a) { const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16); return `rgba(${r},${g},${b},${a})`; }

        // ═══════════════════════════════════════════════════
        //  STATE  — cells[r][c] = string color | null (empty)
        // ═══════════════════════════════════════════════════
        const state = {
            cols: 20, rows: 20, gap: 0, strokeW: 0.5,
            bg: '#ffffff', strokeCol: '#000000', fillCol: '#000000',
            cells: [],
            mode: 'live',
            // image mode
            srcImage: null, imgRes: 250, imgBg: '#ffffff', imgStrokeCol: '#000000', imgFillCol: '#000000',
            imgThreshold: 128, imgBgCut: 220, imgFillCol2: '#ffffff', imgEdge: 0,
            useImageColors: true,
            imageManualGrid: false,
            gapBeforeLive: null,
            hideGrid: false,
            captureMode: 'image',
            exportRatio: null,
        };

        function resetCells() {
            state.cells = Array.from({ length: state.rows }, () => new Array(state.cols).fill(null));
        }
        resetCells();

        // ═══════════════════════════════════════════════════
        //  GRID CANVAS
        // ═══════════════════════════════════════════════════
        const gridCanvas = document.getElementById('grid-canvas');
        const gctx = gridCanvas.getContext('2d');

        // 3 breakpoints: mobile / tablet / desktop
        const BP_MOBILE = 700;
        const BP_TABLET = 1024;
        function getLayoutMode() {
            const w = window.innerWidth || 0;
            if (w <= BP_MOBILE) return 'mobile';
            if (w <= BP_TABLET) return 'tablet';
            return 'desktop';
        }
        function isMobileLayout() { return getLayoutMode() === 'mobile'; }
        function isTabletLayout() { return getLayoutMode() === 'tablet'; }
        function isDesktopLayout() { return getLayoutMode() === 'desktop'; }

        // Live camera "preview fill" mode by breakpoint.
        // - mobile: fill screen (like camera apps) -> cover
        // - tablet: fill screen -> cover
        // - desktop: reduce perceived zoom -> contain
        //
        // Tried making the front/selfie camera "contain" too (to fix 1x looking too tight
        // on a face) — reverted: "contain" leaves visible letterboxing bars around the
        // camera image whenever its native aspect doesn't match the 9:16 target, which read
        // as "the canvas shrank / has white margins instead of filling the screen" — worse
        // than the original complaint. Filling the screen edge-to-edge from a portrait
        // target necessarily requires *some* crop of a wider, landscape-native selfie lens;
        // there's no way to have both full-bleed fill and zero crop at the same time. If the
        // "too close" feeling needs solving, it likely has to be through a less extreme
        // target aspect ratio for the front camera specifically, not this scale mode.
        function getLiveScaleMode() {
            if (isDesktopLayout()) return 'contain';
            return 'cover';
        }


        // Returns cell layout: {cw, ch, ox, oy} — always square cells, centered in canvas
        function cellLayout(W, H) {
            const gap = state.gap;
            const byW = (W - gap * (state.cols - 1)) / state.cols;
            const byH = (H - gap * (state.rows - 1)) / state.rows;
            // Keep full grid visible (contain) — no crop, no stretch.
            const cs = Math.max(1, Math.min(byW, byH));
            const gw = state.cols * cs + (state.cols - 1) * gap;
            const gh = state.rows * cs + (state.rows - 1) * gap;
            return { cw: cs, ch: cs, ox: (W - gw) / 2, oy: (H - gh) / 2 };
        }

        function drawGridToContext(ctx, W, H) {
            const { cw, ch, ox, oy } = cellLayout(W, H);
            const gap = state.gap;
            ctx.fillStyle = state.bg; ctx.fillRect(0, 0, W, H);
            // When Gap=0 the user expects cells to touch (no internal padding).
            // Live always uses full cells; Image uses full cells only when Gap=0.
            const pad = (state.mode === 'live' || state.gap === 0) ? 1 : 0.92;
            const rx0 = cw / 2 * pad, ry0 = ch / 2 * pad;
            for (let row = 0; row < state.rows; row++) {
                for (let col = 0; col < state.cols; col++) {
                    const cx = ox + col * (cw + gap) + cw / 2;
                    const cy = oy + row * (ch + gap) + ch / 2;
                    const cellColor = state.cells[row][col];
                    tracePath(ctx, cx, cy, rx0, ry0);
                    if (cellColor !== null) {
                        ctx.fillStyle = cellColor; ctx.fill();
                    }
                }
            }
        }

        const LIVE_COVER_BASE = 1080;
        // מקור אמת יחיד ליחס: הקנבס (liveCoverCanvas) מוגדר כאן בלבד. היצוא = העתקה של הקנבס.
        // 9:16 = פורטרט מלא (רוחב 1080, גובה 1920). אם הקנבס 9:16 – היצוא 9:16.
        var LIVE_EXPORT_DIMENSIONS = {
            '9:16': { w: 1080, h: 1920 },
            '4:5': { w: 1080, h: 1350 },
            '1:1': { w: 1080, h: 1080 },
            '3:4': { w: 1080, h: 1440 },
            '16:9': { w: 1920, h: 1080 }
        };
        let liveCoverCanvas = null;
        let liveCoverLastRatio = null;

        function renderGrid() {
            const m = document.getElementById('main');
            const isLive = state.mode === 'live';
            const compact = isMobileLayout();
            var W, H;
            if (isLive) {
                const isMobile = compact;
                if (isMobile) {
                    // Compact layout: keep canvas inside #main so it always fits above the panel
                    document.body.classList.remove('live-fullscreen');
                    gridCanvas.style.position = 'absolute';
                    gridCanvas.style.left = '0';
                    gridCanvas.style.top = '0';
                    gridCanvas.style.width = '100%';
                    gridCanvas.style.height = '100%';
                    // Always size to the actual visible canvas area (main),
                    // otherwise opening/closing the panel creates large white margins.
                    W = m.clientWidth;
                    H = m.clientHeight;
                } else {
                    // Desktop: הקנבס חי בתוך main, הפאנל נשאר גלוי בצד
                    document.body.classList.remove('live-fullscreen');
                    gridCanvas.style.position = '';
                    gridCanvas.style.left = '';
                    gridCanvas.style.top = '';
                    gridCanvas.style.width = '';
                    gridCanvas.style.height = '';
                    W = m.clientWidth;
                    H = m.clientHeight;
                }
            } else {
                document.body.classList.remove('live-fullscreen');
                gridCanvas.style.position = '';
                gridCanvas.style.left = '';
                gridCanvas.style.top = '';
                gridCanvas.style.width = '';
                gridCanvas.style.height = '';
                W = m.clientWidth;
                H = m.clientHeight;
            }

            if (isLive) {
                // Live preview: always render into the TARGET ratio frame (single source of truth),
                // then COVER-fit it into #main — fill the screen completely, cropping any excess,
                // so there's never a white margin. (Camera pixels are still "contain" inside the
                // grid itself, i.e. the full camera frame is visible with no crop there.)
                var frameW = Math.max(1, W);
                var frameH = Math.max(1, H);
                var dx = 0, dy = 0;
                var desiredAR = getLiveTargetRatioValue(); // width/height
                if (desiredAR > 1) desiredAR = 1 / desiredAR;
                var screenAR = frameW / frameH;
                if (screenAR > desiredAR) {
                    frameH = Math.max(1, Math.round(frameW / desiredAR));
                    dy = Math.round((H - frameH) / 2);
                } else {
                    frameW = Math.max(1, Math.round(frameH * desiredAR));
                    dx = Math.round((W - frameW) / 2);
                }

                var cw = frameW;
                var ch = frameH;
                var coverKey = 'screen:' + cw + 'x' + ch + ':t=' + getLiveTargetRatioKey();
                if (!liveCoverCanvas || liveCoverLastRatio !== coverKey) {
                    liveCoverCanvas = document.createElement('canvas');
                    liveCoverLastRatio = coverKey;
                }
                liveCoverCanvas.width = cw;
                liveCoverCanvas.height = ch;
                const coverCtx = liveCoverCanvas.getContext('2d');
                drawGridToContext(coverCtx, cw, ch);

                gridCanvas.width = W;
                gridCanvas.height = H;
                gctx.fillStyle = state.bg;
                gctx.fillRect(0, 0, W, H);
                gctx.imageSmoothingEnabled = false;
                gctx.drawImage(liveCoverCanvas, dx, dy, cw, ch);
                gctx.imageSmoothingEnabled = true;
                return;
            }

            gridCanvas.width = W;
            gridCanvas.height = H;
            drawGridToContext(gctx, W, H);
        }

        window.addEventListener('resize', () => {
            // On breakpoint changes, normalize panel state so canvas doesn't "jump"
            try {
                const lm = getLayoutMode();
                if (window.__layoutMode !== lm) {
                    window.__layoutMode = lm;
                    const pan = document.getElementById('panel');
                    const bar = document.getElementById('panel-toggle-bar');
                    if (lm === 'desktop') {
                        if (pan) pan.classList.remove('panel-open');
                        document.body.classList.remove('panel-open');
                        if (bar) bar.classList.remove('active');
                        document.documentElement.style.setProperty('--panel-open-h', '0px');
                    } else {
                        // Start closed on mobile/tablet; opening the panel is user-controlled
                        if (pan) pan.classList.remove('panel-open');
                        document.body.classList.remove('panel-open');
                        if (bar) bar.classList.remove('active');
                        document.documentElement.style.setProperty('--panel-open-h', '0px');
                    }
                }
            } catch (_) { }
            // Keep panel height var in sync (prevents gaps when panel content wraps)
            syncPanelOpenHeightVar();
            // If Live is running and breakpoint changed, restart camera with new constraints
            try {
                if (state.mode === 'live') {
                    const modeNow = getLayoutMode();
                    if (window.__liveLayoutMode !== modeNow) {
                        window.__liveLayoutMode = modeNow;
                        stopCamera();
                        startCamera();
                    }
                }
            } catch (_) { }
            renderGrid();
            if (typeof updateMobileButtonsForMode === 'function') updateMobileButtonsForMode();
        });

        function on(id, ev, fn, opts) {
            const el = document.getElementById(id);
            if (el) el.addEventListener(ev, fn, opts);
            return el;
        }

        // ═══════════════════════════════════════════════════
        //  CONTROLS WIRING
        // ═══════════════════════════════════════════════════

        // Global resolution (controls Image + Live resolution)
        on('g-res', 'input', function () {
            var v = +this.value;
            var vv = document.getElementById('g-res-v'); if (vv) vv.textContent = String(v);
            state.imgRes = v;
            liveState.res = v;
            var ir = document.getElementById('i-res'); if (ir) ir.value = String(v);
            var irv = document.getElementById('i-res-v'); if (irv) irv.textContent = String(v);
            var lr = document.getElementById('l-res'); if (lr) lr.value = String(v);
            var lrv = document.getElementById('l-res-v'); if (lrv) lrv.textContent = String(v);
            state.imageManualGrid = false;
            if (state.mode === 'image' && state.srcImage) applyImage();
        });

        // Fill mode switch (desktop panel switcher; unreachable on phone-only format,
        // kept for the inert desktop code path) – תמיד עוברים דרך switchToMode
        on('fm-image', 'click', () => switchToMode('image'));
        on('fm-live', 'click', () => switchToMode('live'));

        // Image upload
        const dropZone = document.getElementById('drop-zone');
        on('file-input', 'change', e => loadFile(e.target.files[0]));
        // Upload's persistent "add/replace image" button — opens the same file picker
        // the drop-zone uses, so it works whether or not an image is already loaded.
        on('mob-upload-more', 'click', () => document.getElementById('file-input').click());
        if (dropZone) {
            dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
            dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); loadFile(e.dataTransfer.files[0]); });
        }
        function updateUploadZoneVisibility() {
            const uz = document.getElementById('upload-zone');
            if (uz) uz.style.display = (state.mode === 'image' && !state.srcImage) ? 'flex' : 'none';
        }
        function loadFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = ev => { const img = new Image(); img.onload = () => { state.srcImage = img; document.getElementById('file-name').textContent = file.name; updateUploadZoneVisibility(); applyImage(); }; img.src = ev.target.result; };
            reader.readAsDataURL(file);
        }

        // Image-mode color pickers (all call renderGrid directly for instant feedback)
        on('i-res', 'input', function () {
            state.imgRes = +this.value; document.getElementById('i-res-v').textContent = this.value;
            state.imageManualGrid = false;
            if (state.srcImage) applyImage();
        });
        on('i-bg-cut', 'input', function () {
            state.imgBgCut = +this.value; document.getElementById('i-bg-cut-v').textContent = this.value;
            if (state.srcImage) applyImage();
        });
        on('i-thresh', 'input', function () {
            state.imgThreshold = +this.value; document.getElementById('i-thresh-v').textContent = this.value;
            if (state.srcImage) applyImage();
        });
        on('i-use-image-colors', 'click', () => { state.useImageColors = true; if (state.srcImage) applyImage(); });
        on('i-edge', 'input', function () {
            state.imgEdge = +this.value; document.getElementById('i-edge-v').textContent = this.value;
            if (state.srcImage) applyImage();
        });

        // Apply image → cells
        let offC = null, offX = null;
        function sampleImg(src, cols, rows) {
            if (!offC) { offC = document.createElement('canvas'); offX = offC.getContext('2d'); }
            offC.width = cols; offC.height = rows; offX.clearRect(0, 0, cols, rows); offX.drawImage(src, 0, 0, cols, rows);
            return offX.getImageData(0, 0, cols, rows).data;
        }

        // ── Edge Enhance (unsharp mask convolution) ────────────────────────
        // Sharpens luminance by subtracting a fraction of neighbours.
        // Kernel (strength a): [0,-a,0, -a,1+4a,-a, 0,-a,0]
        // Returns a new Float32Array of luminance values, same length as rows*cols.
        function edgeEnhanceLum(px, cols, rows, amount) {
            const lum = new Float32Array(rows * cols);
            // First compute luminance
            for (let i = 0; i < rows * cols; i++) {
                lum[i] = 0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2];
            }
            if (amount === 0) return lum;
            const a = amount * 0.12; // scale so slider 0-10 gives gentle-to-strong
            const out = new Float32Array(rows * cols);
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const idx = r * cols + c;
                    const ctr = lum[idx];
                    const top = r > 0 ? lum[(r - 1) * cols + c] : ctr;
                    const bot = r < rows - 1 ? lum[(r + 1) * cols + c] : ctr;
                    const lft = c > 0 ? lum[r * cols + c - 1] : ctr;
                    const rht = c < cols - 1 ? lum[r * cols + c + 1] : ctr;
                    out[idx] = Math.min(255, Math.max(0, (1 + 4 * a) * ctr - a * (top + bot + lft + rht)));
                }
            }
            return out;
        }
        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(x => {
                const h = Math.max(0, Math.min(255, Math.round(x))).toString(16);
                return h.length === 1 ? '0' + h : h;
            }).join('');
        }

        // Brand palette (for OUTPUT colors: image/live)
        const BRAND_PALETTE_ALL = [
            '#32282c', '#415066', '#324fcd', '#60575e', '#656140',
            '#b66350', '#7d8b96', '#6f8bc2', '#85a352', '#82a4b3',
            '#aaa377', '#a3aeb1', '#b0cddc', '#ddd49b', '#ffffff'
        ];

        // Palette presets provided by user (used for Image + Live quantization)
        const PALETTE_PRESETS = {
            moldy_orange_7: ['#04151f', '#17493e', '#7b9171', '#f5e4c9', '#e58929', '#7c351e', '#4d1f1d'],
            slso8: ['#0d2b45', '#203c56', '#544e68', '#8d697a', '#d08159', '#ffaa5e', '#ffd4a3', '#ffecd6'],
            // Additional palettes (from /color pallete/*.png)
            chasm: ['#85daeb', '#5fc9e7', '#5fa1e7', '#5f6ee7', '#4c60aa', '#444774', '#32313b', '#463c5e', '#5d4776', '#855395', '#ab58a8', '#ca60ae', '#f3a787', '#f5daa7', '#8dd894', '#5dc190', '#4ab9a3', '#4593a5', '#5efdf7', '#ff5dcc', '#fdfe89', '#ffffff'],
            citrink: ['#ffffff', '#fcf660', '#b2d942', '#52c33f', '#166e7a', '#254d70', '#252446', '#201533', '#0f0a1a'],
            eulbink: ['#ffffff', '#0ce6f2', '#0098db', '#1e579c', '#203562', '#252446', '#201533'],
            gothic_bit: ['#0e0e12', '#1a1a24', '#333346', '#535373', '#8080a4', '#a6a6bf', '#c1c1d2', '#e6e6ec'],
            pollen8: ['#73464c', '#ab5675', '#ee6a7c', '#ffa7a5', '#ffe07e', '#ffe7d6', '#72dcbb', '#34acba'],
            pspixel: ['#f000bd', '#8720cc', '#f08000', '#d2136d', '#f0ec00', '#a54a04', '#a2f000', '#4fb414', '#26f9ff', '#316fea', '#2b53aa', '#011b39', '#2f5b79', '#4f9396', '#9cccb3', '#fff2ca'],
            vanilla_milkshake: ['#28282e', '#6c5671', '#d9c8bf', '#f98284', '#b0a9e4', '#accce4', '#b3e3da', '#feaae4', '#87a889', '#b0eb93', '#e9f59d', '#ffe6c6', '#dea38b', '#ffc384', '#fff7a0', '#fff7e4'],
            p31: ['#636663', '#87857c', '#bcad9f', '#f2b888', '#eb9661', '#b55945', '#734c44', '#3d3333', '#593e47', '#7a5859', '#a57855', '#de9f47', '#fdd179', '#fee1b8', '#d4c692', '#a6b04f', '#819447', '#44702d', '#2f4d2f', '#546756', '#89a477', '#a4c5af', '#cae6d9', '#f1f6f0', '#d5d6db', '#bbc3d0', '#96a9c1', '#6c81a1', '#405273', '#303843', '#14233a'],
        };

        // Preset buttons are built directly from PALETTE_PRESETS (no PNG parsing / no async).
        const PALETTE_LABELS = {
            moldy_orange_7: 'Moldy',
            slso8: 'SLSO8',
            chasm: 'Chasm',
            citrink: 'Citrink',
            eulbink: 'Eulbink',
            gothic_bit: 'Gothic',
            pollen8: 'Pollen8',
            pspixel: 'PSPixel',
            vanilla_milkshake: 'Vanilla',
            p31: '31',
        };

        function renderPresetBar() {
            const el = document.getElementById('palette-presets');
            if (!el) return;
            el.innerHTML = '';
            Object.keys(PALETTE_PRESETS).forEach((key) => {
                const colors = PALETTE_PRESETS[key];
                if (!Array.isArray(colors) || colors.length < 2) return;
                const label = PALETTE_LABELS[key] || key.replace(/_/g, ' ');
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'pal-tgt';
                b.dataset.preset = key;
                b.textContent = label;
                b.title = label; // full name on hover/long-press when the button clips it
                if (key === ACTIVE_PALETTE_KEY) b.classList.add('active');
                el.appendChild(b);
            });
        }

        function hexToRgb(hex) {
            const h = String(hex || '').trim();
            const m = /^#?([0-9a-f]{6})$/i.exec(h);
            if (!m) return { r: 0, g: 0, b: 0 };
            const v = parseInt(m[1], 16);
            return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
        }

        let ACTIVE_PALETTE_KEY = 'pollen8';
        let ACTIVE_PALETTE = PALETTE_PRESETS[ACTIVE_PALETTE_KEY].slice();
        let ACTIVE_PALETTE_RGB = ACTIVE_PALETTE.map(hexToRgb);

        function nearestPaletteColorRGB(r, g, b) {
            let best = 0;
            let bestD = Infinity;
            for (let i = 0; i < ACTIVE_PALETTE_RGB.length; i++) {
                const p = ACTIVE_PALETTE_RGB[i];
                const dr = r - p.r, dg = g - p.g, db = b - p.b;
                const d = dr * dr + dg * dg + db * db;
                if (d < bestD) { bestD = d; best = i; }
            }
            return ACTIVE_PALETTE[best];
        }

        function snapHexToBrand(hex) {
            const c = hexToRgb(hex);
            return nearestPaletteColorRGB(c.r, c.g, c.b);
        }

        function setActivePalettePreset(key) {
            if (!PALETTE_PRESETS[key]) return;
            ACTIVE_PALETTE_KEY = key;
            ACTIVE_PALETTE = PALETTE_PRESETS[key].slice();
            ACTIVE_PALETTE_RGB = ACTIVE_PALETTE.map(hexToRgb);
        }

        function paletteLuminance(hex) {
            const c = hexToRgb(hex);
            return 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;
        }

        function getPaletteDarkLight() {
            let dark = ACTIVE_PALETTE[0];
            let light = ACTIVE_PALETTE[0];
            let ld = paletteLuminance(dark);
            let ll = ld;
            for (let i = 1; i < ACTIVE_PALETTE.length; i++) {
                const h = ACTIVE_PALETTE[i];
                const l = paletteLuminance(h);
                if (l < ld) { ld = l; dark = h; }
                if (l > ll) { ll = l; light = h; }
            }
            return { dark, light };
        }

        function applyImage() {
            if (!state.srcImage) return;
            const src = state.srcImage;
            let imgCols, imgRows;
            if (state.imageManualGrid && state.cols > 1 && state.rows > 1) {
                imgCols = state.cols;
                imgRows = state.rows;
            } else {
                const N = state.imgRes;
                const aspect = src.width / src.height;
                imgCols = Math.round(N * aspect);
                imgRows = N;
            }
            state.cols = imgCols; state.rows = imgRows;
            const bgCut = state.imgBgCut;
            const px = sampleImg(src, imgCols, imgRows);
            const lum = edgeEnhanceLum(px, imgCols, imgRows, state.imgEdge);
            state.cells = Array.from({ length: imgRows }, (_, r) =>
                Array.from({ length: imgCols }, (_, c) => {
                    const i = r * imgCols + c;
                    const hasAlpha = px[i * 4 + 3] > 30;
                    const l = lum[i];
                    if (!hasAlpha) return null;
                    // Optional background cutoff (high luminance -> background)
                    if (l >= bgCut) return null;

                    const R = px[i * 4 + 0], G = px[i * 4 + 1], B = px[i * 4 + 2];
                    // Main behavior (Upload/Image): map to FULL active palette (nearest color)
                    if (state.useImageColors) return nearestPaletteColorRGB(R, G, B);

                    // Fallback: if someone disables image colors, still map to palette by luminance (2-tone)
                    const { dark: palDark, light: palLight } = getPaletteDarkLight();
                    return l < state.imgThreshold ? palDark : palLight;
                })
            );
            state.bg = state.imgBg; state.strokeCol = state.imgStrokeCol; state.fillCol = state.imgFillCol;
            renderGrid();
        }

        // ═══════════════════════════════════════════════════
        //  EXPORT
        // ═══════════════════════════════════════════════════
        const EXPORT_MIN_PX = 2400;

        const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth <= 700;

        function dl(cnv, name) {
            // Desktop: prefer synchronous data URL download to avoid losing the user-gesture
            // (some browsers block async-toBlob triggered downloads from a modal button).
            if (!isMobile) {
                try {
                    const url = cnv.toDataURL('image/png');
                    const a = document.createElement('a');
                    a.download = name;
                    a.href = url;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    return;
                } catch (_) { /* fall back to toBlob */ }
            }

            cnv.toBlob(blob => {
                if (!blob) return;
                // On mobile, try Web Share API first (native share sheet)
                if (isMobile && navigator.canShare) {
                    const file = new File([blob], name, { type: 'image/png' });
                    if (navigator.canShare({ files: [file] })) {
                        navigator.share({ files: [file], title: name }).catch(() => {
                            // Share cancelled or failed — fall back to opening in new tab
                            openBlobInTab(blob);
                        });
                        return;
                    }
                }
                // Fallback: standard blob download
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.download = name;
                a.href = url;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 2000);
            }, 'image/png');
        }

        // ═══════════════════════════════════════════════════
        //  EXPORT PREVIEW
        // ═══════════════════════════════════════════════════
        let __pendingExport = null; // { type: 'image', canvas, filename } | { type: 'video', blob, filename, mimeType, url }
        let __exportModalWired = false;

        function closeExportModal() {
            const modal = document.getElementById('export-modal');
            const prev = document.getElementById('export-preview-canvas');
            const prevVid = document.getElementById('export-preview-video');
            if (!modal) return;
            modal.classList.remove('open');
            modal.setAttribute('aria-hidden', 'true');

            if (prevVid) {
                try { prevVid.pause(); } catch (_) { }
                prevVid.removeAttribute('src');
                prevVid.style.display = 'none';
            }
            if (prev) prev.style.display = 'block';

            if (__pendingExport && __pendingExport.type === 'video') {
                try { URL.revokeObjectURL(__pendingExport.url); } catch (_) { }
            }
            __pendingExport = null;
        }

        function ensureExportModalWired() {
            if (__exportModalWired) return;
            __exportModalWired = true;
            const modal = document.getElementById('export-modal');
            const closeBtn = document.getElementById('export-close');
            const okBtn = document.getElementById('export-confirm');
            if (!modal || !closeBtn || !okBtn) return;

            closeBtn.addEventListener('click', closeExportModal);
            modal.addEventListener('click', (e) => { if (e.target === modal) closeExportModal(); });
            okBtn.addEventListener('click', () => {
                if (!__pendingExport) return;
                if (__pendingExport.type === 'image') {
                    dl(__pendingExport.canvas, __pendingExport.filename);
                    closeExportModal();
                    return;
                }
                if (__pendingExport.type === 'video') {
                    const blob = __pendingExport.blob;
                    const fileName = __pendingExport.filename;
                    const mimeType = __pendingExport.mimeType || 'video/webm';
                    const file = new File([blob], fileName, { type: mimeType });
                    const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth <= 700;
                    if (isMobile && navigator.canShare && navigator.canShare({ files: [file] })) {
                        navigator.share({ files: [file], title: 'Pixel Art Maker Video' }).catch(function () {
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = fileName;
                            a.click();
                            setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
                        }).finally(closeExportModal);
                    } else {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileName;
                        a.click();
                        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
                        closeExportModal();
                    }
                }
            });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeExportModal(); });
        }

        function openExportPreview(canvas, filename) {
            const modal = document.getElementById('export-modal');
            const prev = document.getElementById('export-preview-canvas');
            const prevVid = document.getElementById('export-preview-video');
            if (!modal || !prev) { dl(canvas, filename); return; }
            ensureExportModalWired();

            __pendingExport = { type: 'image', canvas, filename };
            if (prevVid) {
                try { prevVid.pause(); } catch (_) { }
                prevVid.removeAttribute('src');
                prevVid.style.display = 'none';
            }
            prev.style.display = 'block';
            prev.width = canvas.width;
            prev.height = canvas.height;
            const pctx = prev.getContext('2d');
            pctx.imageSmoothingEnabled = false;
            pctx.clearRect(0, 0, prev.width, prev.height);
            pctx.drawImage(canvas, 0, 0);

            modal.classList.add('open');
            modal.setAttribute('aria-hidden', 'false');
        }

        function openVideoExportPreview(blob, filename, mimeType) {
            const modal = document.getElementById('export-modal');
            const prev = document.getElementById('export-preview-canvas');
            const prevVid = document.getElementById('export-preview-video');
            if (!modal || !prevVid) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
                return;
            }
            ensureExportModalWired();

            if (prev) prev.style.display = 'none';
            const url = URL.createObjectURL(blob);
            __pendingExport = { type: 'video', blob, filename, mimeType: mimeType || 'video/webm', url };
            prevVid.style.display = 'block';
            prevVid.src = url;
            try { prevVid.currentTime = 0; } catch (_) { }

            modal.classList.add('open');
            modal.setAttribute('aria-hidden', 'false');
        }

        function openBlobInTab(blob) {
            const url = URL.createObjectURL(blob);
            const w = window.open(url, '_blank');
            if (!w) {
                // Popup blocked — use location fallback
                window.location.href = url;
            }
            setTimeout(() => URL.revokeObjectURL(url), 60000);
        }

        function renderHiRes(includeFill, includeHighlight, includeStroke, solidBg) {
            const gap = state.gap;
            const longerSide = Math.max(state.cols, state.rows);
            const scale = Math.max(1, Math.ceil(EXPORT_MIN_PX / longerSide));
            const cs = scale, strokeW = state.strokeW * scale, gapS = gap * scale;
            const W = state.cols * cs + (state.cols - 1) * gapS, H = state.rows * cs + (state.rows - 1) * gapS;
            const r = cs / 2 * .92;
            const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
            const tc = tmp.getContext('2d');
            if (solidBg) { tc.fillStyle = state.bg; tc.fillRect(0, 0, W, H); }
            for (let row = 0; row < state.rows; row++) {
                for (let col = 0; col < state.cols; col++) {
                    const cx = col * (cs + gapS) + cs / 2, cy = row * (cs + gapS) + cs / 2;
                    const cellColor = state.cells[row][col];
                    tracePath(tc, cx, cy, r, r);
                    if (cellColor !== null && includeFill) {
                        tc.fillStyle = cellColor; tc.fill();
                    }
                    if (includeStroke) { tc.strokeStyle = state.strokeCol; tc.lineWidth = strokeW; tc.stroke(); }
                }
            }
            return tmp;
        }

        // Returns { w, h } for canvas: w = horizontal pixels, h = vertical. Portrait (9:16) = narrow×tall.
        function getExportDimensionsForRatio(ratioKey) {
            var k = String(ratioKey || '9:16').trim();
            switch (k) {
                case '9:16': return { w: 1080, h: 1920 };
                case '4:5': return { w: 1536, h: 1920 };
                case '1:1': return { w: 1920, h: 1920 };
                case '16:9': return { w: 1920, h: 1080 };
                case '3:4': return { w: 1440, h: 1920 };
                default: return { w: 1080, h: 1920 };
            }
        }

        function renderHiResForRatio(ratioKey, includeFill, solidBg) {
            var dim = getExportDimensionsForRatio(ratioKey);
            var cnv = document.createElement('canvas');
            cnv.width = dim.w;
            cnv.height = dim.h;
            var ctx = cnv.getContext('2d');
            if (solidBg) { ctx.fillStyle = state.bg; ctx.fillRect(0, 0, dim.w, dim.h); }
            drawGridToContext(ctx, dim.w, dim.h);
            return cnv;
        }

        // הקנבס עצמו: ב-Live העתקה של liveCoverCanvas, ב-Upload יחס הגריד
        function buildDownloadCanvas() {
            var cnv;
            if (state.mode === 'live' && liveCoverCanvas && liveCoverCanvas.width > 0 && liveCoverCanvas.height > 0) {
                cnv = document.createElement('canvas');
                cnv.width = liveCoverCanvas.width;
                cnv.height = liveCoverCanvas.height;
                cnv.getContext('2d').drawImage(liveCoverCanvas, 0, 0);
            } else {
                cnv = document.createElement('canvas');
                var ctx = cnv.getContext('2d');
                var cols = state.cols, rows = state.rows;
                var longSide = 1920;
                var ratio = cols / rows;
                if (ratio >= 1) {
                    cnv.width = longSide;
                    cnv.height = Math.round(longSide / ratio);
                } else {
                    cnv.width = Math.round(longSide * ratio);
                    cnv.height = longSide;
                }
                ctx.fillStyle = state.bg;
                ctx.fillRect(0, 0, cnv.width, cnv.height);
                drawGridToContext(ctx, cnv.width, cnv.height);
            }
            return cnv;
        }
        function downloadPixels() {
            openExportPreview(buildDownloadCanvas(), `pixel_art_maker_${Date.now()}.png`);
        }
        // Upload mode's floating Download FAB sends the edited result to the gallery
        // instead — same as Live's shutter — rather than downloading straight away.
        function saveUploadResultToGallery() {
            addToGallery({ type: 'image', canvas: buildDownloadCanvas(), fileName: `pixel_art_maker_${Date.now()}.png` });
        }
        document.getElementById('dl-pixels').addEventListener('click', downloadPixels);
        document.getElementById('btn-clear').addEventListener('click', () => { resetCells(); renderGrid(); });

        // ═══════════════════════════════════════════════════
        //  LIVE CAMERA
        // ═══════════════════════════════════════════════════
        const liveVideo = document.createElement('video');
        liveVideo.autoplay = true; liveVideo.muted = true; liveVideo.playsInline = true;
        liveVideo.style.display = 'none'; document.body.appendChild(liveVideo);

        const liveState = {
            stream: null, rafId: null,
            res: 250, threshold: 132, bgCut: 255, edge: 10,
            fillCol: '#000000', fillCol2: '#888888', strokeCol: '#000000', bgCol: '#ffffff',
            mirror: true,
            bgPixels: null, bgCols: 0, bgRows: 0, bgDiff: 30,
            facingMode: 'user',
            aspectRatio: '9:16',
            userZoom: 1, // user-controlled zoom (hardware if available, else software)
            userSetFacing: false,
            didSetMobileFacingDefault: false,
            didSetMobileZoomDefault: false,
            didApplyMobileHardwareZoomDefault: false,
            // 0.5x isn't a digital zoom value most hardware can reach via the zoom
            // constraint — it's a physically separate ultra-wide lens on the back camera.
            // These track whether we've switched the whole stream to that lens.
            usingUltraWide: false,
            ultraWideDeviceId: null,
            ultraWideChecked: false,
        };

        // Single source of truth: target preview ratio by breakpoint.
        // - mobile: 9:16 (portrait)
        // - tablet: 3:4 (portrait-ish)
        // - desktop: 9:16 (portrait, per request; keeps behavior consistent across devices)
        function getLiveTargetRatioKey() {
            const mode = getLayoutMode();
            if (mode === 'tablet') return '3:4';
            return '9:16';
        }

        function getLiveTargetRatioValue() {
            return getAspectRatioValue(getLiveTargetRatioKey());
        }

        function getAspectRatioValue(ratioKey) {
            if (ratioKey === '1:1') return 1;
            if (ratioKey === '3:4') return 3 / 4;
            if (ratioKey === '4:5') return 4 / 5;
            if (ratioKey === '16:9') return 16 / 9;
            return 9 / 16; // '9:16' default
        }

        // Same as LIVE_EXPORT_DIMENSIONS – export = exactly what’s on screen
        function getLiveCoverDimensions(ratioKey) {
            var k = String(ratioKey || '9:16').trim();
            return LIVE_EXPORT_DIMENSIONS[k] || LIVE_EXPORT_DIMENSIONS['9:16'];
        }

        const liveOffC = document.createElement('canvas');
        const liveOffX = liveOffC.getContext('2d');
        const liveRotC = document.createElement('canvas');
        const liveRotX = liveRotC.getContext('2d');
        let __liveDebug = null;
        let __liveTrackDebug = null;
        let __liveZoomCaps = null;
        let __liveZoomRange = { min: 1, max: 2, step: 0.01 };

        function ensureLiveOptionsUI() {
            // Zoom UI is handled by the floating button on mobile.
            // Keep live-options minimal/empty.
            const box = document.getElementById('live-options');
            if (!box) return;
            if (box.__wired) return;
            box.__wired = true;
            box.innerHTML = '';
        }

        function computeLiveZoomRange() {
            // max zoom-in requested: 2x
            const cap = __liveZoomCaps;
            const minCap = (cap && typeof cap.min === 'number') ? cap.min : 1;
            const maxCap = (cap && typeof cap.max === 'number') ? cap.max : 2;
            const stepCap = (cap && typeof cap.step === 'number') ? cap.step : 0.01;
            const min = Math.max(0.1, minCap);
            const max = Math.max(min, Math.min(2, maxCap));
            const step = Math.max(0.01, stepCap);
            __liveZoomRange = { min, max, step };
        }

        // ── Curved zoom dial geometry ───────────────────────
        // A ruler bent along an arc, like a phone camera's zoom control: the circle's
        // center sits below the visible SVG box, so only its top "dome" shows. Low zoom
        // is on the left (near ANGLE_MAX, standard math angle), high zoom on the right
        // (near ANGLE_MIN) — angle decreases as the value increases.
        const ZOOM_DIAL_CX = 120, ZOOM_DIAL_CY = 134, ZOOM_DIAL_R = 119;
        const ZOOM_DIAL_ANGLE_MIN = 15, ZOOM_DIAL_ANGLE_MAX = 165;

        function zoomValueToAngle(v, min, max) {
            const t = max > min ? (v - min) / (max - min) : 0;
            return ZOOM_DIAL_ANGLE_MAX - Math.max(0, Math.min(1, t)) * (ZOOM_DIAL_ANGLE_MAX - ZOOM_DIAL_ANGLE_MIN);
        }
        function zoomAngleToValue(angle, min, max) {
            const t = (ZOOM_DIAL_ANGLE_MAX - angle) / (ZOOM_DIAL_ANGLE_MAX - ZOOM_DIAL_ANGLE_MIN);
            return min + Math.max(0, Math.min(1, t)) * (max - min);
        }
        function zoomAnglePoint(angleDeg, radius) {
            const rad = angleDeg * Math.PI / 180;
            return { x: ZOOM_DIAL_CX + radius * Math.cos(rad), y: ZOOM_DIAL_CY - radius * Math.sin(rad) };
        }

        function renderZoomPresets() {
            const box = document.getElementById('mob-zoom-presets');
            if (!box) return;
            const { min, max } = __liveZoomRange || { min: 1, max: 2 };
            const candidates = [min, 1, max].filter((v) => v >= min - 1e-9 && v <= max + 1e-9);
            const uniq = Array.from(new Set(candidates.map((v) => +v.toFixed(2)))).sort((a, b) => a - b);
            let html = uniq.map((v) => {
                let label = v.toFixed(1);
                label = label.replace(/\.0$/, '');
                return `<button type="button" class="mob-zoom-preset" data-z="${v}">${label}×</button>`;
            }).join('');
            // 0.5x is a separate physical ultra-wide lens, not a value the zoom constraint
            // above can reach on most hardware — offer it as its own preset (back camera
            // only; there's no ultra-wide selfie lens) unless the digital range already
            // covers it on its own (some Android devices genuinely do).
            if (liveState.facingMode === 'environment' && !uniq.some((v) => Math.abs(v - 0.5) < 1e-9)) {
                html = `<button type="button" class="mob-zoom-preset" data-z="0.5" data-ultra-wide="1">.5×</button>` + html;
            }
            box.innerHTML = html;
            updateZoomPresetsActive(liveState.usingUltraWide ? 0.5 : (liveState.userZoom || min));
        }

        function updateZoomPresetsActive(value) {
            const box = document.getElementById('mob-zoom-presets');
            if (!box) return;
            const buttons = box.querySelectorAll('.mob-zoom-preset');
            let closest = null, closestDist = Infinity;
            buttons.forEach((b) => {
                const d = Math.abs(parseFloat(b.dataset.z) - value);
                if (d < closestDist) { closestDist = d; closest = b; }
            });
            buttons.forEach((b) => b.classList.toggle('active', b === closest));
        }

        function renderZoomTicks() {
            const g = document.getElementById('mob-zoom-ticks-g');
            const dial = document.getElementById('mob-zoom-dial');
            if (!g) return;
            const { min, max } = __liveZoomRange || { min: 1, max: 2 };
            if (dial) {
                dial.setAttribute('aria-valuemin', String(min));
                dial.setAttribute('aria-valuemax', String(max));
            }
            const NUM_TICKS = 20;
            const p0 = zoomAnglePoint(ZOOM_DIAL_ANGLE_MIN, ZOOM_DIAL_R);
            const p1 = zoomAnglePoint(ZOOM_DIAL_ANGLE_MAX, ZOOM_DIAL_R);
            let svg = `<path d="M ${p0.x.toFixed(1)} ${p0.y.toFixed(1)} A ${ZOOM_DIAL_R} ${ZOOM_DIAL_R} 0 0 0 ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.5" />`;
            for (let i = 0; i <= NUM_TICKS; i++) {
                const t = i / NUM_TICKS;
                const v = min + t * (max - min);
                const angle = zoomValueToAngle(v, min, max);
                const isMajor = (i % 4 === 0);
                const rInner = ZOOM_DIAL_R - (isMajor ? 16 : 9);
                const po = zoomAnglePoint(angle, ZOOM_DIAL_R);
                const pi = zoomAnglePoint(angle, rInner);
                svg += `<line x1="${po.x.toFixed(1)}" y1="${po.y.toFixed(1)}" x2="${pi.x.toFixed(1)}" y2="${pi.y.toFixed(1)}" stroke="var(--text)" stroke-width="${isMajor ? 1.6 : 1}" opacity="${isMajor ? 0.85 : 0.4}" />`;
                if (isMajor) {
                    const pl = zoomAnglePoint(angle, ZOOM_DIAL_R - 28);
                    const label = v < 1 ? v.toFixed(1) : String(Math.round(v * 10) / 10).replace(/\.0$/, '');
                    svg += `<text x="${pl.x.toFixed(1)}" y="${pl.y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="10" font-family="'IBM Plex Mono', monospace" fill="var(--muted)">${label}×</text>`;
                }
            }
            g.innerHTML = svg;
            updateZoomDialIndicator(liveState.userZoom || min);
        }

        function updateZoomDialIndicator(value) {
            const g = document.getElementById('mob-zoom-ticks-g');
            const dial = document.getElementById('mob-zoom-dial');
            if (!g) return;
            const { min, max } = __liveZoomRange || { min: 1, max: 2 };
            const v = Math.max(min, Math.min(max, value));
            const angle = zoomValueToAngle(v, min, max);
            const old = document.getElementById('mob-zoom-indicator');
            if (old) old.remove();
            const po = zoomAnglePoint(angle, ZOOM_DIAL_R + 5);
            const pi = zoomAnglePoint(angle, ZOOM_DIAL_R - 20);
            const ns = 'http://www.w3.org/2000/svg';
            const ind = document.createElementNS(ns, 'g');
            ind.id = 'mob-zoom-indicator';
            const line = document.createElementNS(ns, 'line');
            line.setAttribute('x1', po.x); line.setAttribute('y1', po.y);
            line.setAttribute('x2', pi.x); line.setAttribute('y2', pi.y);
            line.setAttribute('stroke', 'var(--zoom-accent)');
            line.setAttribute('stroke-width', '2.5');
            ind.appendChild(line);
            const dot = document.createElementNS(ns, 'circle');
            dot.setAttribute('cx', String(po.x)); dot.setAttribute('cy', String(po.y));
            dot.setAttribute('r', '4');
            dot.setAttribute('fill', 'var(--zoom-accent)');
            ind.appendChild(dot);
            g.appendChild(ind);

            if (dial) dial.setAttribute('aria-valuenow', v.toFixed(2));
            const label = document.getElementById('mob-zoom-dial-label');
            if (label) {
                let s = v.toFixed(2);
                if (s.indexOf('.') !== -1) s = s.replace(/0+$/, '').replace(/\.$/, '');
                label.textContent = s + '×';
            }
        }

        function setZoomUIValue(val) {
            const r = __liveZoomRange || { min: 1, max: 2 };
            const z = Math.max(r.min, Math.min(r.max, Number(val) || 1));
            liveState.userZoom = z;
            updateZoomDialIndicator(z);
            updateZoomPresetsActive(z);
        }

        function applyHardwareZoomIfPossible(val) {
            try {
                const vt = liveState.stream && liveState.stream.getVideoTracks ? liveState.stream.getVideoTracks()[0] : null;
                const caps = __liveZoomCaps;

        function wireMobileZoomUI() {

        function getMainAspectRatioFallback() {
            try {
                const mainEl = document.getElementById('main');

                }

            const h = window.innerHeight || 1;

        }

        function getLiveVideoConstraints() {
            const mode = getLayoutMode();
            const idealLong = (mode === 'desktop') ? 1920 : (mode === 'tablet' ? 1440 : 1280);

            // Front/selfie camera: don't ask the hardware for our narrow 9:16 target —
            // many front-camera drivers satisfy a narrow aspectRatio request by digitally
            // zooming into the sensor's center rather than just slicing off the sides,
            // which is what made 1x look unnaturally tight on a face (the sensor itself was
            // being told to pre-crop, before our own "cover" crop below ever saw the frame).
            // Ask for the sensor's natural resolution with no aspect constraint instead, and
            // let sampleLiveFrame()'s cover-fit do all the cropping down to 9:16 from that
            // fuller capture — same idea as a real camera app keeping 1x at full native FOV.
            if (liveState.facingMode === 'user') {
                return { facingMode: 'user', width: { ideal: idealLong }, height: { ideal: idealLong } };
            }

            // Back camera: request a stream that matches our target ratio for this
            // breakpoint. Browsers may ignore, but when honored it prevents "stuck 16:9"
            // on mobile — the back camera's much higher native resolution means this
            // narrower crop still keeps plenty of real detail/FOV, unlike the front one.
            let desiredAR = getLiveTargetRatioValue(); // width/height, portrait < 1
            if (desiredAR > 1) desiredAR = 1 / desiredAR;
            const idealH = idealLong;
            const idealW = Math.max(360, Math.round(idealLong * desiredAR));

            const base = {
                width: { ideal: idealW },
                height: { ideal: idealH },
                aspectRatio: { ideal: desiredAR },
                advanced: [
                    { width: idealW, height: idealH },
                    { width: 720, height: 1280 },
                    { width: 1080, height: 1920 },
                ]
            };
            // 0.5x: a specific physical lens, not the zoom constraint — request it by
            // deviceId instead of facingMode (mutually exclusive with facingMode).
            if (liveState.usingUltraWide && liveState.ultraWideDeviceId) {
                return Object.assign({ deviceId: { exact: liveState.ultraWideDeviceId } }, base);
            }
            return Object.assign({ facingMode: liveState.facingMode }, base);
        }

        // Finds the back ultra-wide camera's deviceId, if this device exposes one as its
        // own enumerable input (iOS Safari and most Android browsers do, labeled with
        // "ultra wide" once camera permission has been granted at least once). There's no
        // capability flag for this — matching the label is the only cross-browser way.
        async function findUltraWideDeviceId() {
            if (liveState.ultraWideChecked) return liveState.ultraWideDeviceId;
            liveState.ultraWideChecked = true;
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const match = devices.find((d) => d.kind === 'videoinput' && /ultra.?wide/i.test(d.label));

            } catch (_) {
                liveState.ultraWideDeviceId = null;
            }
            return liveState.ultraWideDeviceId;
        }

        // 0.5x sits below what setZoomUIValue()'s clamping allows (it's built for the
        // continuous digital-zoom dial's own min/max) — mark it active directly instead.
        function markUltraWideActive() {
            liveState.userZoom = 0.5;
            updateZoomPresetsActive(0.5);
        }

        // Switching to/from the ultra-wide lens replaces the whole stream (it's a separate

        // already does. Falls back to the closest available digital zoom if this device
        // has no separate ultra-wide input (most laptops/desktops, some Android phones).
        async function setUltraWideZoom() {

                return;
            }

        // Leaving 0.5x (tapping any other preset, or dragging the dial) switches back to
        // the normal camera if we're currently on the ultra-wide lens.
        async function leaveUltraWideIfNeeded() {
            if (!liveState.usingUltraWide) return;
            liveState.usingUltraWide = false;
            stopCamera();
            await startCamera();
        }

        function sampleLiveFrame() {

            // so the preview stays stable across devices and camera quirks.

            if (targetRatio > 1) targetRatio = 1 / targetRatio;

            // Grid dimensions (cols × rows ≈ N²)

                liveRotC.height = sh;

                liveRotX.clearRect(0, 0, sw, sh);
                liveRotX.translate(sw / 2, sh / 2);
                liveRotX.rotate(dir * (Math.PI / 2));

            }

            const scaleMode = getLiveScaleMode();
            const containScale = Math.min(cols / sw, rows / sh);

        function liveLoop() {

        function switchToMode(mode) {

        // Live colors are derived from the selected palette preset

        // ═══════════════════════════════════════════════════
        //  MOBILE: Panel toggle
        // ═══════════════════════════════════════════════════
        const panelToggleBar = document.getElementById('panel-toggle-bar');
        const panel = document.getElementById('panel');
        const mobShutter = document.getElementById('mob-shutter');
        const mobUploadMore = document.getElementById('mob-upload-more');

        const mobGallery = document.getElementById('mob-gallery');
        const mobZoomPop = document.getElementById('mob-zoom-pop');

        // Mobile FAB visibility by mode:
        // - Live: show shutter + flip + ratio + download
        // - Upload: show download only
        function updateMobileButtonsForMode() {
            const isSmall = isMobileLayout();
            var modeBtn = document.getElementById('mob-capture-mode');
            var zoomPresets = document.getElementById('mob-zoom-presets');
            if (!isSmall) {
                mobShutter.style.display = 'none';
                if (mobUploadMore) mobUploadMore.style.display = 'none';
                mobFlip.style.display = 'none';
                mobDl.style.display = 'none';
                if (mobZoomPop) mobZoomPop.style.display = 'none';
                if (mobRatio) mobRatio.style.display = 'none';
                if (modeBtn) modeBtn.style.display = 'none';
                if (mobGallery) mobGallery.style.display = 'none';
                if (zoomPresets) zoomPresets.style.display = 'none';
                return;
            }

            // The panel now opens downward from the top bar, so it no longer overlaps the
            // bottom controls — no need to hide them while it's open (unlike before, when
            // the panel was a bottom sheet that would sit on top of them).

            // Mobile download FAB:

            // - In Upload keep it available — it now sends the result to the gallery

            mobDl.style.display = (state.mode === 'live') ? 'none' : 'flex';

            if (modeBtn) modeBtn.style.display = 'flex';
            // Gallery is available from both modes now (Upload sends its result there too).

                if (mobUploadMore) mobUploadMore.style.display = 'none';
                mobFlip.style.display = 'flex';

                if (zoomPresets) zoomPresets.style.display = 'flex';

                mobShutter.style.display = 'none';

                // loaded, so there's a way to replace it (the drop-zone itself only shows
                // before the first image is picked).
                if (mobUploadMore) mobUploadMore.style.display = 'flex';
                mobFlip.style.display = 'none';
                if (mobRatio) mobRatio.style.display = 'none';
                if (zoomPresets) zoomPresets.style.display = 'none';
            }
        }

        function toggleMobilePanel() {
            panel.classList.toggle('panel-open');

            // captured frame isn't a blank black canvas.
            drawGridToContext(liveRecordCtx, liveRecordCanvas.width, liveRecordCanvas.height);

            if (MediaRecorder.isTypeSupported('video/mp4')) mime = 'video/mp4';
            else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) mime = 'video/webm;codecs=vp9';
            var canvasStream = liveRecordCanvas.captureStream(LIVE_RECORD_FPS);

        // Add to home screen prompt — shown on mobile when opening from link (not when already launched from icon)
        (function () {
            const installEl = document.getElementById('install-prompt');
            const installBtn = document.getElementById('install-prompt-btn');
            const skipBtn = document.getElementById('install-prompt-skip');
            const manualHint = document.getElementById('install-manual-hint');
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                window.navigator.standalone === true;
            const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth <= 700;
            let deferredPrompt = null;

            window.addEventListener('beforeinstallprompt', function (e) {
                e.preventDefault();
                deferredPrompt = e;
            });

            function showManualHint() {
                if (!manualHint) return;
                if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                    manualHint.textContent = 'In Safari: tap Share (□↑), then "Add to Home Screen", then Add.';
                } else {
                    manualHint.textContent = 'Use your browser menu: ⋮ → "Add to Home screen" or "Install app".';
                }
                manualHint.style.display = 'block';
            }

            function showInstallSteps() {
                if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                    alert('To add Pixelart Maker to your home screen:\n\n1. Tap the Share button (□ with arrow) at the bottom of Safari.\n2. Scroll down and tap "Add to Home Screen".\n3. Tap "Add".');
                } else {
                    showManualHint();
                }
            }

            if (installBtn) installBtn.addEventListener('click', function () {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then(function (r) {
                        if (r.outcome === 'accepted') installEl.classList.remove('show');
                        deferredPrompt = null;
                    });
                } else {
                    showInstallSteps();
                }
            });
            if (skipBtn) skipBtn.addEventListener('click', function () {
                installEl.classList.remove('show');
                try { sessionStorage.setItem('pixelmaker-skip-install', '1'); } catch (_) { }
            });

            if (installEl && isMobile && !isStandalone) {
                try {
                    if (sessionStorage.getItem('pixelmaker-skip-install')) return;
                } catch (_) { }
                installEl.setAttribute('aria-hidden', 'false');
                installEl.classList.add('show');
                if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) showManualHint();
            }
        })();
    </script>
</body>

</html>
